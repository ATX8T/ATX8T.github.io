<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频播放 - ATX8T工具集</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在线播放GitHub托管的MP4视频资源">
  <!-- 统一导航栏 -->
  <script src="../Resource/js/navbar.js"></script>
  <style>
    body {
      background: #f7f7fa;
      font-family: 'Segoe UI', '微软雅黑', Arial, sans-serif;
      margin: 0; padding: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 26px 0 rgba(30,42,135,0.06),0 1.5px 4px 0 rgba(40,47,60,0.04);
    }
    h1 {
      text-align: center;
      color: #2a4d9b;
      margin-bottom: 32px;
      font-size: 2.2em;
      letter-spacing: 1.5px;
    }
    .videos {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
    }
    .video-card {
      background: #f2f4ff;
      border: 1px solid #e1e4ec;
      border-radius: 10px;
      padding: 16px;
      width: 350px;
      box-shadow: 0 2px 10px 0 rgba(50,60,90,0.09);
      transition: transform .15s;
    }
    .video-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 8px 32px 0 rgba(30,80,180,0.08);
    }
    h2 {
      font-size: 1.25em;
      margin-bottom: 10px;
      color: #204080;
      text-align: center;
    }
    video {
      width: 100%;
      border-radius: 8px;
      outline: none;
      background: #061d41;
      margin-bottom: 4px;
    }
    .error-msg {
      color: #a00;
      font-size: 0.97em;
      background: #fff0f0;
      border-radius: 4px;
      margin-top: 2px;
      padding: 2px 6px;
      display: none;
    }
    @media(max-width: 800px){
      .videos { flex-direction: column; align-items: center; }
      .video-card { width: 98%; }
    }
    .note {
      color: #fc8c25;
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.06em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>教学视频播放</h1>
    <div class="note">部分移动端/浏览器可能只允许单一视频同时播放。如遇此现象属正常。</div>
    <div class="videos">
      <div class="video-card">
        <h2>教师</h2>
        <video controls poster="teacher-thumb.jpg" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <source src="jiaoshi.mp4" type="video/mp4">
          浏览器不支持 video 标签
        </video>
        <div class="error-msg">视频加载失败（请检查 jiaoshi.mp4 是否存在）</div>
      </div>
      <div class="video-card">
        <h2>教学鞋</h2>
        <video controls poster="jiaoxie-thumb.jpg" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <source src="jiaoxie.mp4" type="video/mp4">
          浏览器不支持 video 标签
        </video>
        <div class="error-msg">视频加载失败（请检查 jiaoxie.mp4 是否存在）</div>
      </div>
    </div>
  </div>
  <script>
    // 阻止栗浏览器自动暂停其它视频（大多PC浏览器允许多播，这段主要确保不会写错了兼容代码）
    // 该段其实不起决定性作用，现代浏览器已支持多video同播
    document.querySelectorAll('video').forEach(function(v){
      v.addEventListener('play',function(e){
        // 保持其它视频不暂停（移除此处停止其它播放的代码）
      });
    });
  </script>
</body>
</html>
