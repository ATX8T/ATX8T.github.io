<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频播放 - ATX8T</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      background: #f7f7fa;
      font-family: 'Segoe UI', '微软雅黑', Arial, sans-serif;
      padding: 0;
      margin: 0;
    }
    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 24px;
      background: #fff;
      box-shadow: 0 4px 26px 0 rgba(30,42,135,.06),0 1.5px 4px 0 rgba(40,47,60,.04);
      border-radius: 14px;
    }
    h1 {
      text-align: center;
      color: #2a4d9b;
      margin-bottom: 32px;
      font-size: 2.3em;
      letter-spacing: 2px;
    }
    .videos {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
    }
    .video-card {
      background: #f2f4ff;
      border: 1px solid #e1e4ec;
      border-radius: 10px;
      padding: 16px;
      width: 350px;
      box-shadow: 0 2px 10px 0 rgba(50,60,90,.09);
      transition: transform .15s;
    }
    .video-card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 8px 32px 0 rgba(30,80,180,.09);
    }
    h2 {
      font-size: 1.3em;
      margin-bottom: 12px;
      color: #204080;
      text-align: center;
      letter-spacing: 1px;
    }
    video {
      width: 100%;
      border-radius: 8px;
      outline: none;
      background: #061d41;
      margin-bottom: 6px;
    }
    .error-msg {
      color: #a00;
      font-size: 0.97em;
      background: #fff0f0;
      border-radius: 4px;
      margin-top: 2px;
      padding: 2px 6px;
      display: none;
    }
    @media(max-width: 800px){
      .videos { flex-direction: column; align-items: center; }
      .video-card { width: 98%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>教学视频播放</h1>
    <div class="videos">
      <div class="video-card">
        <h2>教师</h2>
        <video controls poster="/Resource/ImgRes/githubpage.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <source src="jiaoshi.mp4" type="video/mp4">
          浏览器不支持 video 标签
        </video>
        <div class="error-msg">视频加载失败（请检查 jiaoshi.mp4 是否存在）</div>
      </div>
      <div class="video-card">
        <h2>教学鞋</h2>
        <video controls poster="/Resource/ImgRes/初音未来.png" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <source src="jiaoxie.mp4" type="video/mp4">
          浏览器不支持 video 标签
        </video>
        <div class="error-msg">视频加载失败（请检查 jiaoxie.mp4 是否存在）</div>
      </div>
    </div>
  </div>
</body>
</html>
