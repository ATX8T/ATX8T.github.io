<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机密码生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>随机密码生成器</h1>
        
        <div class="settings">
            <div class="setting-group">
                <label for="length">密码长度:</label>
                <input type="range" id="length" min="8" max="32" value="16">
                <span id="lengthDisplay">16</span>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="uppercase" checked>
                    大写字母 (A-Z)
                </label>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="lowercase" checked>
                    小写字母 (a-z)
                </label>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="numbers" checked>
                    数字 (0-9)
                </label>
            </div>

            <div class="setting-group">
                <label>
                    <input type="checkbox" id="symbols" checked>
                    特殊字符 (!@#$...)
                </label>
            </div>
        </div>

        <div class="password-display-section">
            <input type="text" id="password" class="password-display" readonly>
            <button id="copy" class="copy-button">复制</button>
        </div>

        <button id="generate" class="generate-button">生成密码</button>

        <p id="message" class="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
