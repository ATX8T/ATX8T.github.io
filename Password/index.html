<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>随机密码生成器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <!-- Bootstrap 5.3.7 CSS (相对路径) -->
  <link href="../Resource/bootstrap530/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    html, body {
      font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;
      background: linear-gradient(135deg, #f7f8fa 0%, #e7ecf0 100%);
      color: #222;
      min-height: 100vh;
      font-size: 16px;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .apple-container {
      width: 80vw;
      max-width: 1100px;
      min-width: 290px;
      margin: 4vw auto 0 auto;
      background: rgba(255,255,255,0.87);
      border-radius: 2.5rem;
      box-shadow: 0 8px 32px rgba(32,46,68,0.10), 0 1.5px 16px rgba(0,0,0,0.04);
      padding: 3vw 3vw 2vw 3vw;
      border: 1.5px solid #e6e7eb;
      position: relative;
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .apple-title {
      text-align: center;
      font-size: 2.3em;
      font-weight: 700;
      color: #222;
      letter-spacing: 2px;
      margin-bottom: 1.3rem;
      margin-top: 0;
      user-select: none;
      text-shadow: 0 1.5px 0 #fff, 0 2px 8px #e3e7ee;
    }
    .output {
      font-size: 1.25em;
      color: #222;
      background: #f3f5f7;
      padding: 1.2em 0.7em;
      border-radius: 18px;
      margin-bottom: 1.2em;
      text-align: center;
      word-break: break-all;
      border: 0.2px solid #e3e7ee;
      font-family: "SF Pro Display", "JetBrains Mono", "Menlo", monospace;
      user-select: all;
      box-shadow: 0 1px 7px #e3e7ee60;
      letter-spacing: 2px;
      transition: border .18s, box-shadow .18s;
      min-height: 2.2em;
      outline: none;
      width: 100%;
      max-width: 510px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn-apple, .btn-copy, .btn-auto, .btn-clear {
      width: 100%;
      padding: 0.85em 0;
      font-size: 1.12em;
      border: none;
      border-radius: 16px;
      font-weight: 600;
      margin-top: 0.7em;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #f7f8fa 0%, #e7ecf0 100%);
      color: #007aff;
      box-shadow: 0 2px 10px #e3e7ee70, 0 1.5px 5px #dbe2ec22;
      transition: background 0.18s, box-shadow 0.18s, color 0.15s;
      border: 1.5px solid #e6e7eb;
      position: relative;
      max-width: 510px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn-apple:active, .btn-copy:active, .btn-auto:active, .btn-clear:active {
      background: #e7ecf0;
      color: #0051a8;
      box-shadow: 0 1px 4px #007aff14;
    }
    .btn-copy {
      color: #34c759;
      margin-top: 0.5em;
    }
    .btn-copy:active { color: #007a36; }
    .btn-auto {
      color: #ff9500;
      margin-top: 0.8em;
    }
    .btn-auto.active {
      background: linear-gradient(180deg, #fffbe8 0%, #ffe9e0 100%);
      color: #ff3b30;
      border: 1.5px solid #ff9500;
    }
    .btn-clear {
      width: auto;
      display: inline-block;
      padding: 4px 18px;
      font-size: 1em;
      margin: 0 0 0 1em;
      background: linear-gradient(180deg, #f7f8fa 0%, #e7ecf0 100%);
      color: #ff3b30;
      border: 1.5px solid #e6e7eb;
      box-shadow: none;
      vertical-align: middle;
    }
    .btn-clear:active {
      background: #ffe9e0;
      color: #f52a0a;
    }
    .message {
      color: #007aff;
      text-align: center;
      margin-top: 1.2em;
      font-size: 1.09em;
      min-height: 1.3em;
      letter-spacing: 1px;
      font-family: -apple-system, "SF Pro Display", "JetBrains Mono", monospace;
      width: 100%;
      max-width: 510px;
      margin-left: auto;
      margin-right: auto;
    }
    .apple-controls {
      margin-bottom: 2.2em;
      margin-top: 2.2em;
      width: 100%;
      max-width: 510px;
      margin-left: auto;
      margin-right: auto;
    }
    .slider-label {
      color: #767680;
      font-size: 1.01em;
      font-weight: 500;
      letter-spacing: 1.0px;
      margin-right: 8px;
      margin-bottom: 0;
    }
    .slider-value {
      background: #f3f5f7;
      color: #007aff;
      padding: 2px 13px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1.01em;
      min-width: 28px;
      text-align: center;
      border: 1.5px solid #e3e7ee;
      margin-left: 10px;
      margin-right: 6px;
      box-shadow: 0 1px 7px #e3e7ee2d;
      display: inline-block;
    }
    input[type="range"].form-range {
      width: 100%;
      accent-color: #007aff;
      height: 5px;
      background: linear-gradient(90deg, #007aff 0%, #e7ecf0 100%);
      outline: none;
      border-radius: 4px;
      box-shadow: 0 1px 5px #e3e7ee2a;
      margin: 0 10px 0 0;
      padding: 0;
      min-width: 80px;
    }
    .form-check-label {
      color: #222;
      font-size: 1em;
      padding-left: 2px;
      font-weight: 500;
    }
    .form-check-input:checked {
      background-color: #007aff;
      border-color: #007aff;
    }
    .history-section {
      margin-top: 1.6em;
      background: rgba(247, 248, 250, 0.98);
      border-radius: 1.2em;
      padding: 1em 1em 0.6em 1em;
      border: 1.3px solid #e6e7eb;
      max-height: 320px; /* 高度加大 */
      overflow-y: auto;
      box-shadow: 0 2px 14px #e3e7ee40;
      position: relative;
      width: 100%;
      max-width: 510px;
      margin-left: auto;
      margin-right: auto;
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .history-title {
      color: #222;
      font-size: 1.01em;
      font-weight: 600;
      letter-spacing: 1.1px;
    }
    .history-list {
      list-style: decimal inside;
      color: #555;
      font-family: "JetBrains Mono", "Menlo", monospace;
      font-size: 1em;
      padding-left: 0;
      margin: 0;
      max-width: 100%;
      word-break: break-all;
      background: transparent;
    }
    .history-list li {
      margin-bottom: 2px;
      padding-left: 0;
      user-select: all;
      background: none;
      border: none;
      border-radius: 6px;
      transition: background 0.18s;
      padding: 1px 4px;
      word-break: break-all;
      font-size: 0.95em;
    }
    .history-list li:first-child {
      background: linear-gradient(90deg, #e0f0ff 5%, #e9ecf0 100%);
      color: #007aff;
      font-weight: 600;
      font-size: 1.03em;
      border-radius: 8px;
      box-shadow: 0 1px 8px #e3e7ee3d;
    }
    /* 响应式优化 */
    @media (max-width: 1200px) {
      .apple-container {
        width: 92vw;
        max-width: 98vw;
        padding: 4vw 2vw 2vw 2vw;
      }
    }
    @media (max-width: 900px) {
      .apple-container {
        width: 98vw;
        max-width: 99vw;
        padding: 2vw 1vw 1vw 1vw;
      }
    }
    @media (max-width: 700px) {
      .apple-container {
        width: 99vw;
        max-width: 100vw;
        padding: 8px 0.5vw 8vw 0.5vw;
        border-radius: 18px;
      }
      .apple-title {
        font-size: 1.22em;
        margin-bottom: 1em;
      }
      .btn-apple, .btn-copy, .btn-auto {
        font-size: 1em;
        border-radius: 10px;
        padding: 0.7em 0;
      }
      .output {
        font-size: 0.98em;
        padding: 0.6em 0.2em;
        border-radius: 11px;
        min-height: 1.5em;
      }
      .slider-label { font-size: 0.97em;}
      .slider-value { font-size: 0.95em; border-radius: 8px; }
      .history-section {
        max-height: 150px;
        padding: 0.7em 0.7em 0.3em 0.7em;
        border-radius: 10px;
      }
      .history-list li { font-size: 0.9em; border-radius: 5px;}
    }
    @media (max-width: 400px) {
      .apple-container { padding: 7px 2vw 7vw 2vw; }
      .apple-title { font-size: 1em; }
      .output { font-size: 0.9em; }
      .btn-apple, .btn-copy, .btn-auto { font-size: 0.96em; }
    }
  </style>
</head>
<link rel="icon" type="image/png" href="img/lock.png">
<body>
  <div class="apple-container shadow">
    <div class="apple-title">随机密码生成器</div>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">


  

    <div id="password" class="output mb-2" tabindex="0">点击生成密码</div>
    <button class="btn-apple" onclick="generatePassword()">生成密码</button>
    <button class="btn-copy" onclick="copyPassword()">复制密码</button>
    <button class="btn-auto" id="autoBtn" onclick="toggleAuto()">开启自动生成</button>
    <form class="apple-controls">
      <div class="mb-3 row align-items-center">
        <label class="col-5 slider-label" for="length">密码长度</label>
        <div class="col-7 d-flex align-items-center">
          <input type="range" id="length" min="4" max="32" value="12" class="form-range" oninput="updateLengthDisplay(this.value)">
          <span id="slider-value" class="slider-value">12</span>
        </div>
      </div>
      <div class="row">
        <div class="col-6">
          <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="upper" checked>
            <label class="form-check-label" for="upper">大写字母 (A-Z)</label>
          </div>
          <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="lower" checked>
            <label class="form-check-label" for="lower">小写字母 (a-z)</label>
          </div>
        </div>
        <div class="col-6">
          <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="number" checked>
            <label class="form-check-label" for="number">数字 (0-9)</label>
          </div>
          <div class="form-check mb-1">
            <input class="form-check-input" type="checkbox" id="symbol">
            <label class="form-check-label" for="symbol">符号 (!@#...)</label>
          </div>
        </div>
      </div>
    </form>
    <div id="message" class="message"></div>
    <div class="history-section mt-4" id="history-section">
      <div class="history-header">
        <div class="history-title">历史记录（最多100条）</div>
        <button type="button" class="btn-clear" onclick="clearHistory()">一键清除</button>
      </div>
      <ol id="history-list" class="history-list mb-0"></ol>
    </div>
  </div>


  <!-- 跳转按钮，放在容器外部底部 -->
  <div class="text-center my-4">
    <a href="index02.html" class="btn btn-primary px-4 py-2" style="font-size:1.1em;border-radius:12px;">
      2.0版本
    </a>
  </div>

  <div class="text-center my-4">
    <a href="index03.html" class="btn btn-primary px-4 py-2" style="font-size:1.1em;border-radius:12px;">
      3.0版本
    </a>
  </div>


  <!-- Bootstrap 5.3.7 JS (相对路径) -->
  <script src="../Resource/bootstrap530/js/bootstrap.bundle.min.js"></script>
  <script>
    let passwordHistory = [];
    let autoInterval = null;
    let autoMode = false;

    // 加载历史
    function loadHistory() {
      const stored = localStorage.getItem('passwordHistory');
      if (stored) {
        try {
          passwordHistory = JSON.parse(stored) || [];
        } catch (e) {
          passwordHistory = [];
        }
      }
      renderHistory(true);
    }

    // 保存历史
    function saveHistory() {
      localStorage.setItem('passwordHistory', JSON.stringify(passwordHistory));
    }

    // 渲染历史区域，参数scrollToTop为true时自动滚动到顶部
    function renderHistory(scrollToTop = false) {
      const list = document.getElementById('history-list');
      list.innerHTML = "";
      passwordHistory.slice(0, 100).forEach((pwd, i) => {
        const li = document.createElement('li');
        li.textContent = pwd;
        list.appendChild(li);
      });
      // 自动滚动到最新（顶部）
      if (scrollToTop && list.firstChild) {
        list.parentElement.scrollTop = 0;
      }
    }

    // 一键清除历史
    function clearHistory() {
      passwordHistory = [];
      saveHistory();
      renderHistory(true);
    }

    function updateLengthDisplay(val) {
      document.getElementById('slider-value').innerText = val;
    }

    // 获取加密安全的随机整数
function getCryptoRandomInt(max) {
  if (window.crypto && window.crypto.getRandomValues) {
    const array = new Uint32Array(1);
    window.crypto.getRandomValues(array);
    return array[0] % max;
  } else {
    // 兼容性兜底
    return Math.floor(Math.random() * max);
  }
}

// 无重复字符密码生成（加密安全版）
function generateUniquePassword(length, chars) {
  if (length > chars.length) {
    return null;
  }
  let arr = chars.split('');
  for (let i = arr.length - 1; i > 0; i--) {
    const j = getCryptoRandomInt(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.slice(0, length).join('');
}

    function generatePassword(showMessage = true) {
      const length = parseInt(document.getElementById('length').value);
      const upper = document.getElementById('upper').checked;
      const lower = document.getElementById('lower').checked;
      const number = document.getElementById('number').checked;
      const symbol = document.getElementById('symbol').checked;

      const upperChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const lowerChars = 'abcdefghijklmnopqrstuvwxyz';
      const numberChars = '0123456789';
      const symbolChars = '!@#$%^&*()-=_+[]{}|;:,.<>/?';

      let chars = '';
      if (upper) chars += upperChars;
      if (lower) chars += lowerChars;
      if (number) chars += numberChars;
      if (symbol) chars += symbolChars;

      if (!chars) {
        document.getElementById('password').innerText = '请选择至少一种字符类型';
        if (showMessage) document.getElementById('message').innerText = '';
        return;
      }
      if (length > chars.length) {
        document.getElementById('password').innerText = '当前选择的字符类型数量不足以生成不重复的密码，请减少长度或增加字符集';
        if (showMessage) document.getElementById('message').innerText = '';
        return;
      }

      let password = generateUniquePassword(length, chars);
      if (!password) {
        document.getElementById('password').innerText = '生成失败，请调整参数';
        if (showMessage) document.getElementById('message').innerText = '';
        return;
      }

      document.getElementById('password').innerText = password;
      if (showMessage) document.getElementById('message').innerText = '';

      // 入历史且不重复
      if (!passwordHistory.includes(password)) {
        passwordHistory.unshift(password);
        if (passwordHistory.length > 100) passwordHistory = passwordHistory.slice(0, 100);
        saveHistory();
        renderHistory(true);
      } else {
        renderHistory(true);
      }
    }

    function copyPassword() {
      const password = document.getElementById('password').innerText;
      if (!password || password === '点击生成密码'
        || password === '请选择至少一种字符类型'
        || password.startsWith('当前选择的字符类型数量不足')) {
        document.getElementById('message').innerText = '请先生成密码';
        return;
      }
      navigator.clipboard.writeText(password).then(function() {
        document.getElementById('message').innerText = '已复制到剪贴板！';
      }, function() {
        document.getElementById('message').innerText = '复制失败，请手动复制。';
      });
    }

    // 自动生成功能
    function toggleAuto() {
      const btn = document.getElementById('autoBtn');
      autoMode = !autoMode;
      if (autoMode) {
        btn.textContent = '停止自动生成';
        btn.classList.add('active');
        autoInterval = setInterval(() => {
          generatePassword(false);
        }, 1000);
      } else {
        btn.textContent = '开启自动生成';
        btn.classList.remove('active');
        if (autoInterval) clearInterval(autoInterval);
      }
    }

    // 监听页面关闭时关闭自动模式
    window.addEventListener('beforeunload', function() {
      if (autoInterval) clearInterval(autoInterval);
    });

    // 初始化
    clearHistory(); // 刷新时自动清空历史
    updateLengthDisplay(document.getElementById('length').value);
    loadHistory();
  </script>
</body>
</html>
