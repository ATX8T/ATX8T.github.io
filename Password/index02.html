<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>高级密码生成器</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <!-- Bootstrap 5.3.7 CSS -->
  <link href="../bootstrap537/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  
  <style>
    /* Windows 11 风格 */
    :root {
      --win-accent: #0078D7;
      --win-background: #f3f3f3;
      --win-panel: rgba(255, 255, 255, 0.7);
      --win-panel-alt: rgba(240, 240, 240, 0.7);
      --win-border: rgba(255, 255, 255, 0.5);
      --win-text: #333;
      --win-text-light: #666;
      --win-button: rgba(255, 255, 255, 0.8);
      --win-button-hover: rgba(240, 240, 240, 0.9);
      --win-button-active: rgba(220, 220, 220, 0.9);
      --win-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }
    
    html, body {
      font-family: "Segoe UI", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      background: var(--win-background);
      color: var(--win-text);
      min-height: 100vh;
      font-size: 16px;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    .win-container {
      width: 80vw;
      max-width: 1100px;
      min-width: 290px;
      margin: 4vw auto 0 auto;
      background: var(--win-panel);
      border-radius: 18px;
      box-shadow: var(--win-shadow);
      border: 1px solid var(--win-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 2rem;
      position: relative;
    }
    
    .win-title {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--win-text);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
    }
    
    .win-title i {
      margin-right: 0.75rem;
      color: var(--win-accent);
    }
    
    .output {
      font-size: 1.25rem;
      background: var(--win-panel-alt);
      border: 1px solid var(--win-border);
      border-radius: 8px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: center;
      word-break: break-all;
      font-family: "Consolas", "JetBrains Mono", monospace;
      user-select: all;
      transition: all 0.2s ease;
      min-height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .output:focus {
      outline: none;
      border-color: var(--win-accent);
      box-shadow: 0 0 0 3px rgba(0, 120, 215, 0.25);
    }
    
    .win-btn {
      background: var(--win-button);
      border: 1px solid var(--win-border);
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      font-weight: 500;
      color: var(--win-text);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }
    
    .win-btn:hover {
      background: var(--win-button-hover);
    }
    
    .win-btn:active {
      background: var(--win-button-active);
    }
    
    .win-btn i {
      margin-right: 0.5rem;
    }
    
    .btn-primary {
      background: var(--win-accent);
      color: white;
      border-color: var(--win-accent);
    }
    
    .btn-primary:hover {
      background: #0063B1;
      border-color: #0063B1;
    }
    
    .btn-primary:active {
      background: #005A9E;
      border-color: #005A9E;
    }
    
    .btn-auto {
      color: var(--win-accent);
    }
    
    .btn-auto.active {
      background: rgba(0, 120, 215, 0.1);
      color: var(--win-accent);
      font-weight: 600;
    }
    
    .win-controls {
      margin: 2rem 0;
    }
    
    .slider-container {
      display: flex;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    
    .slider-label {
      font-size: 1rem;
      font-weight: 500;
      color: var(--win-text);
      margin-right: 1rem;
      min-width: 8rem;
    }
    
    .slider-value {
      background: var(--win-panel-alt);
      border: 1px solid var(--win-border);
      border-radius: 6px;
      padding: 0.25rem 0.75rem;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--win-accent);
      min-width: 2.5rem;
      text-align: center;
      margin-left: 1rem;
    }
    
    input[type="range"].form-range {
      width: 100%;
      height: 0.35rem;
      background: rgba(0, 0, 0, 0.1);
      border-radius: 0.25rem;
      accent-color: var(--win-accent);
    }
    
    .form-check {
      margin-bottom: 0.75rem;
    }
    
    .form-check-label {
      font-size: 1rem;
      color: var(--win-text);
    }
    
    .form-check-input {
      border-radius: 0.25rem;
      border-color: rgba(0, 0, 0, 0.25);
    }
    
    .form-check-input:checked {
      background-color: var(--win-accent);
      border-color: var(--win-accent);
    }
    
    .message {
      font-size: 1rem;
      color: var(--win-text-light);
      text-align: center;
      margin: 1rem 0;
      min-height: 1.5rem;
    }
    
    .history-section {
      background: var(--win-panel-alt);
      border: 1px solid var(--win-border);
      border-radius: 8px;
      padding: 1rem;
      margin-top: 1.5rem;
    }
    
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
    
    .history-title {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--win-text);
    }
    
    .btn-clear {
      background: transparent;
      border: none;
      color: var(--win-accent);
      font-size: 0.9rem;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    
    .btn-clear:hover {
      background: rgba(0, 120, 215, 0.1);
    }
    
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 150px;
      overflow-y: auto;
    }
    
    .history-list li {
      background: rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
      font-family: "Consolas", "JetBrains Mono", monospace;
      font-size: 0.9rem;
      word-break: break-all;
      transition: all 0.2s ease;
    }
    
    .history-list li:first-child {
      background: rgba(0, 120, 215, 0.1);
      color: var(--win-accent);
      font-weight: 500;
    }
    
    /* 滚动条样式 */
    .history-list::-webkit-scrollbar {
      width: 6px;
    }
    
    .history-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
      border-radius: 3px;
    }
    
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
    }
    
    .history-list::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.2);
    }
    
    /* 响应式调整 */
    @media (max-width: 768px) {
      .win-container {
        width: 95vw;
        padding: 1.5rem;
        margin-top: 2rem;
      }
      
      .win-title {
        font-size: 1.5rem;
      }
      
      .output {
        font-size: 1rem;
        padding: 0.75rem;
      }
      
      .win-btn {
        padding: 0.6rem 1rem;
        font-size: 0.9rem;
      }
      
      .slider-container {
        flex-direction: column;
        align-items: flex-start;
      }
      
      .slider-label {
        margin-bottom: 0.5rem;
      }
      
      .slider-value {
        margin-left: 0;
        margin-top: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="win-container">
    <div class="win-title">
      <i class="fa fa-key"></i>高级密码生成器
    </div>

    <div id="password" class="output mb-4" tabindex="0">点击生成密码</div>
    
    <div class="d-grid gap-3">
      <button class="win-btn btn-primary" onclick="generatePassword()">
        <i class="fa fa-refresh"></i>生成密码
      </button>
      <button class="win-btn" onclick="copyPassword()">
        <i class="fa fa-clipboard"></i>复制密码
      </button>
      <button class="win-btn btn-auto" id="autoBtn" onclick="toggleAuto()">
        <i class="fa fa-clock-o"></i>开启自动生成
      </button>
    </div>
    
    <div class="win-controls">
      <div class="slider-container">
        <label class="slider-label" for="length">密码长度</label>
        <input type="range" id="length" min="4" max="32" value="12" class="form-range" oninput="updateLengthDisplay(this.value)">
        <span id="slider-value" class="slider-value">12</span>
      </div>
      
      <div class="row">
        <div class="col-md-6">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="upper" checked>
            <label class="form-check-label" for="upper">大写字母 (A-Z)</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="lower" checked>
            <label class="form-check-label" for="lower">小写字母 (a-z)</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="number" checked>
            <label class="form-check-label" for="number">数字 (0-9)</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="symbol">
            <label class="form-check-label" for="symbol">符号 (!@#$%)</label>
          </div>
        </div>
      </div>
    </div>
    
    <div id="message" class="message"></div>
    
    <div class="history-section">
      <div class="history-header">
        <div class="history-title">历史记录</div>
        <button class="btn-clear" onclick="clearHistory()">
          <i class="fa fa-trash-o"></i>清空
        </button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </div>
  </div>

  <script src="../bootstrap537/js/bootstrap.bundle.min.js"></script>
  <script>
    const state = {
      password: '',
      autoMode: false,
      autoInterval: 3, // 默认3秒
      intervalId: null,
      passwordHistory: []
    };

    const elements = {
      passwordDisplay: document.getElementById('password'),
      autoBtn: document.getElementById('autoBtn'),
      lengthInput: document.getElementById('length'),
      sliderValue: document.getElementById('slider-value'),
      upperCheckbox: document.getElementById('upper'),
      lowerCheckbox: document.getElementById('lower'),
      numberCheckbox: document.getElementById('number'),
      symbolCheckbox: document.getElementById('symbol'),
      message: document.getElementById('message'),
      historyList: document.getElementById('history-list')
    };

    function updateLengthDisplay(value) {
      elements.sliderValue.textContent = value;
    }

    function generatePassword() {
      const length = parseInt(elements.lengthInput.value);
      let charset = '';

      if (elements.upperCheckbox.checked) charset += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      if (elements.lowerCheckbox.checked) charset += 'abcdefghijklmnopqrstuvwxyz';
      if (elements.numberCheckbox.checked) charset += '0123456789';
      if (elements.symbolCheckbox.checked) charset += '!@#$%^&*()_+-=[]{}|;:\'",.<>/?';

      if (charset === '') {
        elements.message.textContent = '请至少选择一种字符类型';
        return;
      }

      let password = '';
      for (let i = 0; i < length; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
      }

      elements.passwordDisplay.textContent = password;
      state.password = password;
      state.passwordHistory.unshift(password);
      updateHistoryList();
      elements.message.textContent = '';
    }

    function copyPassword() {
      if (state.password) {
        navigator.clipboard.writeText(state.password).then(() => {
          elements.message.textContent = '密码已复制到剪贴板';
        }).catch(() => {
          elements.message.textContent = '复制失败，请重试';
        });
      } else {
        elements.message.textContent = '请先生成密码';
      }
    }

    function toggleAuto() {
      if (state.autoMode) {
        clearInterval(state.intervalId);
        elements.autoBtn.textContent = '开启自动生成';
        elements.autoBtn.classList.remove('active');
      } else {
        state.intervalId = setInterval(generatePassword, state.autoInterval * 1000);
        elements.autoBtn.textContent = '关闭自动生成';
        elements.autoBtn.classList.add('active');
      }
      state.autoMode = !state.autoMode;
    }

    function updateHistoryList() {
      elements.historyList.innerHTML = '';
      state.passwordHistory.forEach((password, index) => {
        const li = document.createElement('li');
        li.textContent = password;
        elements.historyList.appendChild(li);
      });
    }

    function clearHistory() {
      state.passwordHistory = [];
      updateHistoryList();
    }
  </script>
</body>
</html>
