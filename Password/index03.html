<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器 3.0</title>
    <link rel="stylesheet" href="../Bootstrap537Overall/css/bootstrap.min.css">
    <style>
        .password-box {
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #passwordDisplay {
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }
    </style>
</head>
<body class="bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="password-box p-5 mb-4">
            <h1 class="mb-4">🔐 密码生成器 3.0</h1>
            
            <div class="mb-3">
                <label class="form-label">密码长度</label>
                <input type="range" class="form-range" id="lengthRange" min="8" max="32" value="16">
                <span id="lengthValue" class="badge bg-primary">16</span>
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="uppercase" checked>
                        <label class="form-check-label" for="uppercase">包含大写字母 (A-Z)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="numbers" checked>
                        <label class="form-check-label" for="numbers">包含数字 (0-9)</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="symbols" checked>
                        <label class="form-check-label" for="symbols">包含符号 (!@#$%)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="excludeSimilar" checked>
                        <label class="form-check-label" for="excludeSimilar">排除相似字符 (1lI0O)</label>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button class="btn btn-primary btn-lg" onclick="generatePassword()">生成新密码</button>
                <button class="btn btn-success btn-lg" onclick="copyPassword()">复制密码</button>
            </div>

            <div class="alert alert-success mt-3" id="passwordDisplay" role="alert"></div>
        </div>
    </div>

    <script src="/bootstrap-5.3.7-dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const characterSets = {
            lowercase: 'abcdefghijkmnopqrstuvwxyz',
            uppercase: 'ABCDEFGHJKLMNPQRSTUVWXYZ',
            numbers: '23456789',
            symbols: '!@#$%&*?',
        };

        document.getElementById('lengthRange').addEventListener('input', function() {
            document.getElementById('lengthValue').textContent = this.value;
        });

        function generatePassword() {
            const length = parseInt(document.getElementById('lengthRange').value);
            let charset = '';
            
            if (document.getElementById('uppercase').checked) charset += characterSets.uppercase;
            if (document.getElementById('numbers').checked) charset += characterSets.numbers;
            if (document.getElementById('symbols').checked) charset += characterSets.symbols;
            
            // 确保至少包含小写字母
            charset += characterSets.lowercase;

            let password = '';
            for (let i = 0; i < length; i++) {
                password += charset.charAt(Math.floor(Math.random() * charset.length));
            }

            if (document.getElementById('excludeSimilar').checked) {
                password = password.replace(/[1lI0O]/g, '');
            }

            document.getElementById('passwordDisplay').textContent = password;
        }

        function copyPassword() {
            const password = document.getElementById('passwordDisplay').textContent;
            navigator.clipboard.writeText(password).then(() => {
                alert('密码已复制到剪贴板！');
            });
        }
    </script>
</body>
</html>
