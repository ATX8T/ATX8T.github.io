<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎来到我的个人空间</title>
    <!-- 引入字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- 引入图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 基础样式 */
        body {
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-x: hidden;
        }
        
        /* 全屏欢迎容器 */
        .welcome-container {
            height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* 背景装饰元素 */
        .welcome-container::before,
        .welcome-container::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 8s ease-in-out infinite;
        }
        
        .welcome-container::before {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -200px;
        }
        
        .welcome-container::after {
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: -150px;
            animation-delay: 2s;
        }
        
        /* 标题样式 */
        .main-title {
            font-size: 4rem;
            color: white;
            font-weight: 700;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards 0.5s;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        
        /* 副标题样式 */
        .sub-title {
            font-size: 1.5rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards 0.8s;
            max-width: 800px;
        }
        
        /* 按钮样式 */
        .enter-btn {
            padding: 15px 40px;
            background-color: white;
            color: #667eea;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeUp 1s ease forwards 1.1s;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
        
        .enter-btn:hover {
            background-color: #f8f9fa;
            transform: translateY(-5px);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
        }
        
        /* 滚动提示 */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            opacity: 0.7;
            animation: bounce 2s infinite;
        }
        
        /* 动画定义 */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-30px);
            }
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(10px);
            }
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            
            .sub-title {
                font-size: 1.2rem;
            }
            
            .enter-btn {
                padding: 12px 30px;
                font-size: 1rem;
            }
            
            .welcome-container::before {
                width: 400px;
                height: 400px;
                top: -150px;
                right: -150px;
            }
            
            .welcome-container::after {
                width: 300px;
                height: 300px;
                bottom: -100px;
                left: -100px;
            }
        }
        
        @media (max-width: 480px) {
            .main-title {
                font-size: 2rem;
            }
            
            .sub-title {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <h1 class="main-title">你好，欢迎光临</h1>
        <p class="sub-title">这是我的个人空间，记录生活、分享思考与创作</p>
        <button class="enter-btn" onclick="enterWebsite()">
            <i class="fas fa-arrow-right"></i> 进入主页
        </button>
        <div class="scroll-indicator">
            <i class="fas fa-chevron-down"></i>
        </div>
    </div>

    <script>
        // 进入网站的函数
        function enterWebsite() {
            // 这里可以替换为你的主页URL
            // window.location.href = "your-main-page.html";
            
            // 演示效果：模拟页面跳转的平滑过渡
            const container = document.querySelector('.welcome-container');
            container.style.opacity = '0';
            container.style.transition = 'opacity 0.8s ease';
            
            setTimeout(() => {
                alert('欢迎进入我的个人主页！');
                // 重置效果
                container.style.opacity = '1';
            }, 800);
        }

        // 监听滚动事件，添加交互效果
        window.addEventListener('scroll', () => {
            const scrollY = window.scrollY;
            const container = document.querySelector('.welcome-container');
            container.style.backgroundPositionY = `${scrollY * 0.5}px`;
        });
    </script>
</body>
</html>
