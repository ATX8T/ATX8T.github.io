<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科技风格交互动画 | Tech Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4b 50%, #0d0f2a 100%);
            color: #00ff88;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* 背景网格动画 */
        .grid-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gridMove {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(50px);
            }
        }

        /* 光线效果 */
        .glow-line {
            position: fixed;
            pointer-events: none;
            z-index: 2;
        }

        .glow-line.horizontal {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.5), transparent);
            animation: glowPulse 3s ease-in-out infinite;
        }

        .glow-line.vertical {
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(0, 255, 136, 0.5), transparent);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: hidden;
        }

        /* 粒子系统 */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            top: 0;
            left: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 136, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
        }

        /* 主标题 */
        .main-title {
            text-align: center;
            margin-bottom: 60px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        .main-title h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00ff88, #00d4ff, #00ff88);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s linear infinite;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            letter-spacing: 3px;
        }

        .main-title p {
            font-size: 1.2rem;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            animation: fadeInOut 3s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% center;
            }
            100% {
                background-position: 200% center;
            }
        }

        @keyframes titleGlow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.5), 0 0 40px rgba(0, 212, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(0, 255, 136, 0.8), 0 0 60px rgba(0, 212, 255, 0.5);
            }
        }

        @keyframes fadeInOut {
            0%, 100% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
        }

        /* 交互卡片 */
        .cards-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1200px;
        }

        .tech-card {
            width: 280px;
            height: 320px;
            background: rgba(10, 20, 50, 0.6);
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-radius: 15px;
            padding: 30px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* 卡片背景光线 */
        .tech-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .tech-card:hover {
            border-color: rgba(0, 255, 136, 0.8);
            background: rgba(0, 255, 136, 0.05);
            transform: translateY(-15px) scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4), inset 0 0 20px rgba(0, 255, 136, 0.1);
        }

        .tech-card:hover::before {
            opacity: 1;
        }

        .tech-card.active {
            border-color: rgba(0, 212, 255, 0.8);
            background: rgba(0, 212, 255, 0.08);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.5), inset 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .card-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: block;
            animation: iconFloat 3s ease-in-out infinite;
        }

        .tech-card:hover .card-icon {
            animation: iconSpin 0.6s ease-in-out;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes iconSpin {
            0% {
                transform: rotateY(0deg) rotateX(0deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(360deg);
            }
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #00ff88;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .card-description {
            font-size: 0.95rem;
            color: #b0e0e6;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-button {
            padding: 10px 20px;
            border: 1px solid #00ff88;
            background: transparent;
            color: #00ff88;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-button:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            transform: scale(1.05);
        }

        .card-button:active {
            transform: scale(0.95);
        }

        /* 鼠标跟踪效果 */
        .mouse-circle {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 136, 0.6);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
            transition: all 0.05s ease-out;
            display: none;
        }

        .mouse-circle.active {
            display: block;
        }

        .mouse-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: rgba(0, 255, 136, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 101;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
            display: none;
        }

        .mouse-dot.active {
            display: block;
        }

        /* 交互文本 */
        .interaction-text {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
            animation: bounce 2s ease-in-out infinite;
            z-index: 20;
        }

        @keyframes bounce {
            0%, 100% {
                opacity: 0.5;
                transform: translateX(-50%) translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) translateY(-10px);
            }
        }

        /* 点击波纹效果 */
        .ripple {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.8) 0%, transparent 70%);
            pointer-events: none;
            z-index: 50;
            animation: rippleExpand 0.6s ease-out forwards;
        }

        @keyframes rippleExpand {
            0% {
                width: 20px;
                height: 20px;
                opacity: 1;
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .main-title h1 {
                font-size: 2.5rem;
            }

            .tech-card {
                width: 250px;
                height: 280px;
            }

            .cards-container {
                gap: 20px;
            }

            .mouse-circle,
            .mouse-dot {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="grid-background"></div>
    <div class="glow-line horizontal" style="top: 25%;"></div>
    <div class="glow-line vertical" style="left: 25%;"></div>
    <div class="glow-line horizontal" style="top: 75%;"></div>
    <div class="glow-line vertical" style="right: 25%;"></div>
    
    <div class="particles" id="particlesContainer"></div>
    <div class="mouse-circle" id="mouseCircle"></div>
    <div class="mouse-dot" id="mouseDot"></div>

    <div class="container">
        <div class="main-title">
            <h1>TECH ANIMATION</h1>
            <p>✨ 交互式动画演示 | 科技风格前端 ✨</p>
        </div>

        <div class="cards-container">
            <div class="tech-card" onclick="cardClick(event)">
                <span class="card-icon">⚡</span>
                <div class="card-title">高性能</div>
                <p class="card-description">采用现代Web技术构建，确保流畅的动画体验和响应速度</p>
                <button class="card-button">了解更多</button>
            </div>

            <div class="tech-card" onclick="cardClick(event)">
                <span class="card-icon">🎨</span>
                <div class="card-title">视觉设计</div>
                <p class="card-description">炫彩渐变、光线效果和科技感背景营造沉浸式视觉体验</p>
                <button class="card-button">了解更多</button>
            </div>

            <div class="tech-card" onclick="cardClick(event)">
                <span class="card-icon">🖱️</span>
                <div class="card-title">交互增强</div>
                <p class="card-description">鼠标跟踪、点击波纹、悬停动画等丰富的交互功能</p>
                <button class="card-button">了解更多</button>
            </div>

            <div class="tech-card" onclick="cardClick(event)">
                <span class="card-icon">🌟</span>
                <div class="card-title">动画效果</div>
                <p class="card-description">多层次的动画设计，从微交互到宏观动画应有尽有</p>
                <button class="card-button">了解更多</button>
            </div>

            <div class="tech-card" onclick="cardClick(event)">
                <span class="card-icon">🚀</span>
                <div class="card-title">快速加载</div>
                <p class="card-description">纯前端实现，无需后端支持，开箱即用的动画方案</p>
                <button class="card-button">了解更多</button>
            </div>

            <div class="tech-card" onclick="cardClick(event)">
                <span class="card-icon">💻</span>
                <div class="card-title">跨平台</div>
                <p class="card-description">适配各种设备和浏览器，提供一致的视觉体验</p>
                <button class="card-button">了解更多</button>
            </div>
        </div>

        <div class="interaction-text">
            👆 移动鼠标 | 点击卡片 | 探索动画 👆
        </div>
    </div>

    <script>
        // 初始化粒子系统
        function initParticles() {
            const container = document.getElementById('particlesContainer');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                const duration = 5 + Math.random() * 10;
                const delay = Math.random() * 5;

                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.animation = `floatParticle ${duration}s linear ${delay}s infinite`;

                container.appendChild(particle);
            }

            // 添加粒子浮动动画
            const style = document.createElement('style');
            style.textContent = `
                @keyframes floatParticle {
                    0% {
                        transform: translateY(0) translateX(0);
                        opacity: 0;
                    }
                    10% {
                        opacity: 1;
                    }
                    90% {
                        opacity: 1;
                    }
                    100% {
                        transform: translateY(-${window.innerHeight}px) translateX(${Math.random() * 100 - 50}px);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        }

        // 鼠标跟踪效果
        const mouseCircle = document.getElementById('mouseCircle');
        const mouseDot = document.getElementById('mouseDot');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // 更新圆圈位置
            mouseCircle.style.left = (mouseX - 15) + 'px';
            mouseCircle.style.top = (mouseY - 15) + 'px';
            mouseCircle.classList.add('active');

            // 更新点的位置
            mouseDot.style.left = (mouseX - 4) + 'px';
            mouseDot.style.top = (mouseY - 4) + 'px';
            mouseDot.classList.add('active');

            // 更新卡片的光线效果
            updateCardGlow();
        });

        document.addEventListener('mouseleave', () => {
            mouseCircle.classList.remove('active');
            mouseDot.classList.remove('active');
        });

        // 卡片光线效果
        function updateCardGlow() {
            const cards = document.querySelectorAll('.tech-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const cardCenterX = rect.left + rect.width / 2;
                const cardCenterY = rect.top + rect.height / 2;

                const distance = Math.sqrt(
                    Math.pow(mouseX - cardCenterX, 2) + 
                    Math.pow(mouseY - cardCenterY, 2)
                );

                const before = card.querySelector('::before') || card;
                if (distance < 300) {
                    const angle = Math.atan2(mouseY - cardCenterY, mouseX - cardCenterX) * 180 / Math.PI;
                    before.style.background = `radial-gradient(circle at ${50 + Math.cos(angle * Math.PI / 180) * 50}% ${50 + Math.sin(angle * Math.PI / 180) * 50}%, rgba(0, 255, 136, 0.2) 0%, transparent 70%)`;
                }
            });
        }

        // 卡片点击效果
        function cardClick(event) {
            const card = event.currentTarget;
            const rect = card.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            // 添加active类
            document.querySelectorAll('.tech-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');

            // 创建波纹效果
            createRipple(x, y);

            // 播放卡片动画
            card.style.animation = 'none';
            setTimeout(() => {
                card.style.animation = '';
            }, 10);

            // 3秒后移除active类
            setTimeout(() => {
                card.classList.remove('active');
            }, 3000);
        }

        // 创建波纹效果
        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = (x - 10) + 'px';
            ripple.style.top = (y - 10) + 'px';
            document.body.appendChild(ripple);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        }

        // 点击页面时创建波纹
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.tech-card')) {
                createRipple(e.clientX, e.clientY);
            }
        });

        // 键盘交互
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                const cards = document.querySelectorAll('.tech-card');
                const activeIndex = Array.from(cards).findIndex(c => c.classList.contains('active'));
                let newIndex = activeIndex + (e.key === 'ArrowRight' ? 1 : -1);
                
                if (newIndex < 0) newIndex = cards.length - 1;
                if (newIndex >= cards.length) newIndex = 0;

                if (cards[newIndex]) {
                    cards[newIndex].click();
                }
            }
        });

        // 初始化
        initParticles();

        // 响应式处理
        window.addEventListener('resize', () => {
            if (window.innerWidth <= 768) {
                document.getElementById('mouseCircle').style.display = 'none';
                document.getElementById('mouseDot').style.display = 'none';
            }
        });
    </script>
</body>
</html>
