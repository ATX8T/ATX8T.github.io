name: Extract Navigation Links

on:
  push:
    paths:
      - '**/*.md'
  workflow_dispatch: {}

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract links from Markdown files
        run: |
          set -euo pipefail
          out="NavigationBar/NavigationBar.txt"
          mkdir -p NavigationBar
          > "$out"

          # Iterate over all tracked .md files
          while IFS= read -r -d '' file; do
            awk '{
              if ($0 ~ /直接打开/) {
                if (match($0, /(https?:\/\/[^ )\t\"]+)/, m)) {
                  print m[1]
                } else {
                  if (getline > 0) {
                    if (match($0, /(https?:\/\/[^ )\t\"]+)/, m2)) print m2[1]
                  }
                }
              }
            }' "$file" >> "$out"
          done < <(git ls-files -z -- '*.md')

          # Deduplicate while preserving order
          if [ -f "$out" ]; then
            awk '!seen[$0]++' "$out" > "$out.tmp" && mv "$out.tmp" "$out"
          fi

      - name: Commit and push NavigationBar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NavigationBar/NavigationBar.txt || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NavigationBar links"
            git push
          fi