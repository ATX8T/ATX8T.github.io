name: Extract "直接打开" Links to NavigationBar.txt

# 触发条件：推送到任意分支时执行
on:
  push:
    branches: [ "**" ]

jobs:
  extract-links:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 确保能获取所有历史（可选，根据需求）

      # 2. 安装依赖（Ubuntu 内置 awk/grep，无需额外安装）
      - name: Setup environment
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix  # 处理换行符兼容

      # 3. 遍历MD文件，提取链接并写入目标文件
      - name: Extract links from MD files
        run: |
          # 定义目标文件路径
          TARGET_FILE="ATX8T.github.io/NavigationBar/NavigationBar.txt"
          
          # 创建目标目录（如果不存在）
          mkdir -p $(dirname "$TARGET_FILE")
          
          # 清空目标文件（避免历史内容残留）
          > "$TARGET_FILE"
          
          # 遍历所有.md文件，提取 "- 直接打开 (链接)" 格式的链接
          # 解释：
          # - find . -name "*.md"：遍历所有md文件
          # - grep -oP '- 直接打开 \(\K[^)]+'：匹配 "- 直接打开 (xxx)" 并提取括号内的xxx
          # - dos2unix：统一换行符为LF（兼容Windows/Mac）
          # - sort -u：可选，去重（根据需求决定是否保留）
          find . -type f -name "*.md" -exec grep -oP '- 直接打开 \(\K[^)]+' {} \; | dos2unix | sort -u >> "$TARGET_FILE"
          
          # 输出验证（可选）
          echo "提取的链接列表："
          cat "$TARGET_FILE"

      # 4. 提交并推送修改后的文件到仓库
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update NavigationBar.txt with extracted links"
          file_pattern: "ATX8T.github.io/NavigationBar/NavigationBar.txt"
          branch: ${{ github.ref_name }}  # 推送到触发工作流的分支
