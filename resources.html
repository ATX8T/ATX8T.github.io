<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>资源浏览 · GitHub 图床</title>
    <link rel="stylesheet" href="bootstra538dist/css/bootstrap.min.css">
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #fff;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --accent: #0d6efd;
            --radius: 8px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }
        .navbar { background: var(--card-bg) !important; border-bottom: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .navbar-brand { font-weight: 700; color: var(--accent) !important; }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .card-header { background: transparent; border-bottom: 1px solid var(--border); font-weight: 600; }

        .btn-group .btn { font-size: .82rem; }
        .btn-group .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .table { --bs-table-bg: transparent; margin: 0; }
        .table th { font-weight: 600; font-size: .8rem; color: var(--text-muted); border-color: var(--border); }
        .table td { border-color: var(--border); vertical-align: middle; font-size: .9rem; }
        .table tr:hover { background: rgba(13,110,253,.04); }

        .file-icon { font-size: 1.1rem; width: 28px; text-align: center; }
        .file-name { font-weight: 500; }
        .file-path { font-size: .78rem; color: var(--text-muted); font-family: monospace; }

        .breadcrumb { margin: 0; }
        .breadcrumb-item a { color: var(--accent); text-decoration: none; }
        .breadcrumb-item a:hover { text-decoration: underline; }

        .copy-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #333; color: #fff; padding: 8px 20px; border-radius: 20px;
            font-size: .85rem; z-index: 9999; display: none;
        }

        .preview-img { max-height: 60vh; max-width: 100%; object-fit: contain; }
        .preview-video { max-height: 60vh; max-width: 100%; }

        @media (max-width: 768px) {
            .btn-group .btn { font-size: .72rem; padding: 4px 8px; }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="resources.html">📁 资源浏览</a>
        <div class="navbar-nav flex-row gap-2">
            <a class="nav-link" href="index.html">链接转换</a>
            <a class="nav-link active fw-semibold" href="resources.html">资源浏览</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <!-- 工具栏 -->
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <div class="btn-group btn-group-sm flex-wrap">
            <button class="btn btn-outline-primary active" data-filter="all" onclick="setFilter('all',this)">全部</button>
            <button class="btn btn-outline-primary" data-filter="image" onclick="setFilter('image',this)">🖼️ 图片</button>
            <button class="btn btn-outline-primary" data-filter="video" onclick="setFilter('video',this)">🎬 视频</button>
            <button class="btn btn-outline-primary" data-filter="archive" onclick="setFilter('archive',this)">📦 APK/安装包</button>
            <button class="btn btn-outline-primary" data-filter="doc" onclick="setFilter('doc',this)">📄 文档</button>
            <button class="btn btn-outline-primary" data-filter="other" onclick="setFilter('other',this)">📁 其他</button>
        </div>
        <span class="ms-auto text-muted small">共 <strong id="fileCount">0</strong> 个文件</span>
        <button class="btn btn-sm btn-outline-secondary" onclick="loadFiles()">🔄 刷新</button>
    </div>

    <!-- 面包屑 -->
    <div id="breadcrumb" class="mb-3"></div>

    <!-- 加载 -->
    <div id="loadingBox" class="text-center py-5">
        <div class="spinner-border text-primary mb-2"></div>
        <p class="text-muted">正在加载文件列表...</p>
    </div>

    <!-- 空 -->
    <div id="emptyBox" class="text-center py-5 d-none">
        <p class="text-muted">没有匹配的文件</p>
    </div>

    <!-- 表格 -->
    <div class="card">
        <div class="table-responsive">
            <table id="fileTable" class="table table-hover d-none">
                <thead><tr>
                    <th style="width:36px">#</th>
                    <th>文件名</th>
                    <th style="width:90px">大小</th>
                    <th style="width:150px">操作</th>
                </tr></thead>
                <tbody id="fileBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- 预览弹窗 -->
<div class="modal fade" id="previewModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="border:1px solid var(--border); border-radius:var(--radius);">
            <div class="modal-header" style="border-bottom:1px solid var(--border);">
                <h6 class="modal-title" id="previewTitle"></h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body text-center p-0" id="previewBody" style="min-height:100px;background:#f8f9fa;"></div>
            <div class="modal-footer" style="border-top:1px solid var(--border);">
                <button class="btn btn-sm btn-outline-secondary" onclick="copyRaw()">📋 复制 Raw</button>
                <a id="previewDl" class="btn btn-sm btn-success" download>⬇️ 下载</a>
                <button class="btn btn-sm btn-secondary" data-bs-dismiss="modal">关闭</button>
            </div>
        </div>
    </div>
</div>

<div class="copy-toast" id="copyToast"><span></span></div>
<input type="hidden" id="currentRaw" value="">

<script src="bootstra538dist/js/bootstrap.bundle.min.js"></script>
<script src="js/resources.js?v=2"></script>
</body>
</html>
