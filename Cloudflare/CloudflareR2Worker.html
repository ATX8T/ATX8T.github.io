<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Cloudflare R2 图床自动批量获取工具</title>
  <link href="../Bootstrap537Overall/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; padding: 2em; background: #f7f7f9;}
    .preview { max-width: 120px; max-height: 120px; margin-right: 12px; vertical-align: middle; border-radius: 8px; }
    .img-list-item { display: flex; align-items: center; margin-bottom: 18px; background: #fff; border-radius: 10px; box-shadow: 0 2px 10px #e3e7ee40; padding: 12px 18px;}
    .img-link { word-break: break-all; flex: 1; color: #007bff; text-decoration: none; margin-right: 10px;}
    .copy-btn { min-width: 80px; }
    .copied-tip { color: #28a745; font-size: 0.95em; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">R2 图床批量图片自动获取工具</h2>
    <div class="mb-3">
      <button class="btn btn-primary me-2" onclick="listImages()">自动获取全部图片</button>
      <button class="btn btn-success" onclick="exportLinks()">导出下载链接</button>
    </div>
    <ul id="img-list" class="list-unstyled"></ul>
  </div>
  <script src="../Bootstrap537Overall/js/bootstrap.bundle.min.js"></script>
  <script>
    let imageLinks = [];
    async function listImages() {
      let url = 'https://dgh.tongyongzh6568956.workers.dev/api/list';
      const imgList = document.getElementById('img-list');
      imgList.innerHTML = '<li>加载中...</li>';
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("API请求失败");
        const files = await res.json();
        imageLinks = [];
        if (!files.length) {
          imgList.innerHTML = '<li>没有找到图片</li>';
          return;
        }
        let html = '';
        files.forEach((f, idx) => {
          const isImg = /\.(jpg|jpeg|png|gif|webp|bmp|svg)$/i.test(f.key);
          imageLinks.push(f.url);
          html += `<li class="img-list-item">
            ${isImg ? `<img class="preview" src="${f.url}" alt="">` : ''}
            <a class="img-link" href="${f.url}" target="_blank">${f.url}</a>
            <button class="btn btn-outline-secondary btn-sm copy-btn" data-url="${f.url}" onclick="copyLink(this)">复制</button>
            <span class="copied-tip" style="display:none;">已复制!</span>
          </li>`;
        });
        imgList.innerHTML = html;
      } catch (e) {
        imgList.innerHTML = `<li>加载失败：${e.message}</li>`;
      }
    }

    function exportLinks() {
      if (!imageLinks.length) {
        alert('请先获取图片列表！');
        return;
      }
      const blob = new Blob([imageLinks.join('\n')], {type: 'text/plain'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'image_links.txt';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    window.copyLink = function(btn) {
      const url = btn.getAttribute('data-url');
      navigator.clipboard.writeText(url).then(() => {
        // 显示已复制提示
        const tip = btn.nextElementSibling;
        tip.style.display = 'inline';
        setTimeout(() => { tip.style.display = 'none'; }, 1200);
      });
    }
  </script>
</body>
</html>
