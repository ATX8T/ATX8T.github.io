<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>密码生成器 · ATX8T</title>
    <style>
        :root {
            --bg: #f2f2f7; --card: rgba(255,255,255,.72); --text: #1d1d1f;
            --text-2: #6e6e73; --text-3: #aeaeb2; --sep: rgba(60,60,67,.08);
            --accent: #007aff; --red: #ff3b30; --orange: #ff9500; --green: #34c759;
            --fill: rgba(120,120,128,.12); --fill-2: rgba(120,120,128,.06);
            --radius: 14px;
        }
        * { margin:0;padding:0;box-sizing:border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
        }

        /* ====== 导航 ====== */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 0; flex-shrink: 0;
            background: rgba(242,242,247,.78);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: .5px solid var(--sep);
        }
        .nav-inner { width: 86%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .nav a { text-decoration: none; font-size: .92rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 7px; }
        .nav img { width: 24px; height: 24px; border-radius: 50%; }
        .nav .back { color: var(--accent); font-weight: 500; font-size: .88rem; }

        /* ====== 上部固定区 ====== */
        .top-area {
            flex-shrink: 0;
            width: 86%; margin: 0 auto;
            padding: 14px 0 0;
        }

        .card {
            background: var(--card);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: .5px solid var(--sep); border-radius: var(--radius);
            padding: 16px 20px;
        }
        .card + .card { margin-top: 10px; }

        /* 密码显示 */
        .pw-display {
            text-align: center;
            font-family: 'SF Mono','Menlo','Consolas',monospace;
            font-size: 1.8rem; font-weight: 600; letter-spacing: .06em;
            word-break: break-all; line-height: 1.35;
            user-select: all; cursor: text; min-height: 1.35em;
            padding: 4px 0;
        }
        .pw-display.placeholder { font-family: -apple-system,'SF Pro Text',sans-serif; font-size: 1.05rem; letter-spacing: 0; color: var(--text-3); }
        .pw-actions { display: flex; justify-content: center; gap: 12px; margin-top: 10px; }
        .pw-btn {
            width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
            font-size: 1.1rem; background: var(--fill-2); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            transition: all .2s cubic-bezier(.25,.8,.25,1.2);
            -webkit-tap-highlight-color: transparent;
        }
        .pw-btn:active { transform: scale(.88); background: var(--fill); }
        .pw-btn.copied { background: var(--green); color: #fff; transform: scale(1.08); }
        .pw-btn.failed { background: var(--red); color: #fff; }
        .gen-btn {
            padding: 11px 28px; border-radius: 24px; border: none; cursor: pointer;
            font-size: .95rem; font-weight: 600; background: var(--accent); color: #fff;
            transition: all .2s cubic-bezier(.25,.8,.25,1.2);
            -webkit-tap-highlight-color: transparent;
        }
        .gen-btn:active { transform: scale(.95); opacity: .85; }

        /* 强度 */
        .strength-inline { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .strength-bar { flex:1; height:5px; border-radius:5px; background: var(--fill-2); overflow: hidden; }
        .strength-fill { height:100%; border-radius:5px; transition: width .4s, background .4s; }
        .strength-word { font-size:.82rem; font-weight:600; min-width:48px; text-align:right; }
        .strength-meta { font-size:.74rem; color:var(--text-2); margin-top:3px; }

        /* 设置 */
        .section-title {
            font-size: .74rem; font-weight: 600; color: var(--text-2);
            text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px;
        }
        .len-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
        .len-val {
            min-width:38px; height:30px; border-radius:8px; background: var(--fill-2);
            display:flex; align-items:center; justify-content:center;
            font-size:.95rem; font-weight:700; flex-shrink:0;
        }
        input[type=range] {
            -webkit-appearance:none; flex:1; height:6px; border-radius:6px;
            background:var(--fill); outline:none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance:none; width:24px; height:24px; border-radius:50%;
            background:#fff; border:.5px solid rgba(0,0,0,.08);
            box-shadow:0 2px 8px rgba(0,0,0,.1); cursor:pointer;
        }
        .range-end { font-size:.76rem; color:var(--text-3); min-width:24px; text-align:right; }

        .seg { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; margin-bottom:10px; }
        @media(max-width:480px){ .seg{grid-template-columns:1fr 1fr;} }
        .seg-btn {
            padding:10px 4px; border-radius:10px; font-size:.82rem; font-weight:500;
            background:var(--fill-2); color:var(--text-2); border:none;
            cursor:pointer; text-align:center; transition:all .15s;
            -webkit-tap-highlight-color:transparent; line-height:1.2;
        }
        .seg-btn.active { background:var(--accent); color:#fff; }
        .seg-btn sub { font-size:.7rem; color:var(--text-3); font-weight:400; display:block; }
        .seg-btn.active sub { color:rgba(255,255,255,.65); }

        .switch-row { display:flex; align-items:center; justify-content:space-between; padding:5px 0; }
        .switch-row .sw-label { font-size:.88rem; font-weight:500; }
        .toggle {
            width:44px; height:26px; border-radius:26px; background:var(--fill);
            cursor:pointer; position:relative; transition:background .25s; flex-shrink:0;
            -webkit-tap-highlight-color:transparent;
        }
        .toggle::after {
            content:''; position:absolute; width:22px; height:22px; border-radius:50%;
            background:#fff; top:2px; left:2px;
            box-shadow:0 1px 3px rgba(0,0,0,.12);
            transition:transform .25s cubic-bezier(.25,.8,.25,1.2);
        }
        .toggle.on { background:var(--green); }
        .toggle.on::after { transform:translateX(18px); }

        .count-row { display:flex; align-items:center; gap:10px; }
        .count-badge { min-width:38px; height:30px; border-radius:8px; background:var(--fill-2); display:flex; align-items:center; justify-content:center; font-size:.95rem; font-weight:700; }

        /* ====== 底部滚动区 ====== */
        .bottom-area {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            width: 86%; margin: 0 auto;
            padding: 10px 0 20px;
            -webkit-overflow-scrolling: touch;
        }
        .bottom-area .card + .card { margin-top: 10px; }

        /* 批量 */
        .batch-list { display: flex; flex-direction: column; gap: 6px; }
        .batch-item {
            display:flex; align-items:center; gap:10px;
            padding:9px 12px; border-radius:10px; background:var(--fill-2);
        }
        .batch-pw {
            flex:1; font-family:'SF Mono','Menlo',monospace;
            font-size:.82rem; font-weight:500; word-break:break-all; letter-spacing:.03em;
        }
        .batch-copy {
            font-size:.76rem; padding:5px 12px; border-radius:14px;
            border:none; cursor:pointer; font-weight:500;
            background:rgba(0,122,255,.12); color:var(--accent);
            transition:all .2s cubic-bezier(.25,.8,.25,1.2); flex-shrink:0;
        }
        .batch-copy.copied { background:var(--green); color:#fff; }
        .batch-copy.failed { background:var(--red); color:#fff; }

        /* 历史 */
        .history-item {
            display:flex; align-items:center; justify-content:space-between;
            padding:7px 0; border-bottom:.5px solid var(--sep); gap:10px;
        }
        .history-item:last-child { border-bottom:none; }
        .h-pw {
            font-family:'SF Mono','Menlo',monospace; font-size:.8rem;
            font-weight:500; flex:1; word-break:break-all; letter-spacing:.02em;
        }
        .h-time {
            font-size:.74rem; color:var(--text-3); font-variant-numeric:tabular-nums;
            flex-shrink:0; min-width:52px; text-align:right;
        }
        .h-copy {
            font-size:.74rem; padding:4px 10px; border-radius:12px;
            border:none; cursor:pointer; font-weight:500;
            background:rgba(0,122,255,.12); color:var(--accent);
            transition:all .2s cubic-bezier(.25,.8,.25,1.2); flex-shrink:0;
        }
        .h-copy.copied { background:var(--green); color:#fff; }
        .h-copy.failed { background:var(--red); color:#fff; }
        .empty { padding:10px 0; text-align:center; color:var(--text-3); font-size:.8rem; }

        /* 批量 */
        .batch-list { display: flex; flex-direction: column; gap: 5px; }
        .batch-item {
            display:flex; align-items:center; gap:8px;
            padding:7px 10px; border-radius:8px; background:var(--fill-2);
        }
        .batch-pw {
            flex:1; font-family:'SF Mono','Menlo',monospace;
            font-size:.73rem; font-weight:500; word-break:break-all; letter-spacing:.03em;
        }
        .batch-copy {
            font-size:.68rem; padding:4px 10px; border-radius:14px;
            border:none; cursor:pointer; font-weight:500;
            background:rgba(0,122,255,.12); color:var(--accent);
            transition:all .2s cubic-bezier(.25,.8,.25,1.2); flex-shrink:0;
        }
        .batch-copy.copied { background:var(--green); color:#fff; }
        .batch-copy.failed { background:var(--red); color:#fff; }

        /* 历史 */
        .history-list { }
        .history-item {
            display:flex; align-items:center; justify-content:space-between;
            padding:6px 0; border-bottom:.5px solid var(--sep); gap:8px;
        }
        .history-item:last-child { border-bottom:none; }
        .h-pw {
            font-family:'SF Mono','Menlo',monospace; font-size:.7rem;
            font-weight:500; flex:1; word-break:break-all; letter-spacing:.02em;
        }
        .h-time {
            font-size:.66rem; color:var(--text-3); font-variant-numeric:tabular-nums;
            flex-shrink:0; min-width:48px; text-align:right;
        }
        .h-copy {
            font-size:.66rem; padding:3px 9px; border-radius:12px;
            border:none; cursor:pointer; font-weight:500;
            background:rgba(0,122,255,.12); color:var(--accent);
            transition:all .2s cubic-bezier(.25,.8,.25,1.2); flex-shrink:0;
        }
        .h-copy.copied { background:var(--green); color:#fff; }
        .h-copy.failed { background:var(--red); color:#fff; }
        .empty { padding:8px 0; text-align:center; color:var(--text-3); font-size:.76rem; }

        /* Toast */
        .toast {
            position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:99999;
            background:rgba(0,0,0,.82); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            color:#fff; padding:10px 24px; border-radius:22px;
            font-size:.88rem; font-weight:500; display:none;
            box-shadow:0 8px 32px rgba(0,0,0,.25);
            pointer-events:none;
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="/"><img src="https://github.com/ATX8T.png" alt=""> ATX8T</a>
        <a class="back" href="/">← 首页</a>
    </div>
</nav>

<!-- ====== 上部固定区 ====== -->
<div class="top-area">

    <!-- 密码显示 -->
    <div class="card">
        <div class="pw-display placeholder" id="passwordText">配置下方选项后点击生成</div>
        <div class="pw-actions">
            <button class="pw-btn" id="btnCopy" onclick="copyPassword()">📋</button>
        </div>
        <div class="strength-inline">
            <div class="strength-bar"><div class="strength-fill" id="strengthBar"></div></div>
            <span class="strength-word" id="strengthText" style="color:var(--text-3)">-</span>
        </div>
        <div class="strength-meta" id="strengthDetails"></div>
    </div>

    <!-- 设置 -->
    <div class="card">
        <div class="section-title">密码长度</div>
        <div class="len-row">
            <div class="len-val" id="lengthValue">16</div>
            <input type="range" id="lengthSlider" min="6" max="64" value="16" oninput="onLengthChange(this.value)">
            <span class="range-end">64</span>
        </div>

        <div class="section-title">生成数量</div>
        <div class="count-row">
            <div class="count-badge" id="countBadge">1</div>
            <input type="range" id="countSlider" min="1" max="10" value="1" oninput="onCountChange(this.value)" style="flex:1">
            <span class="range-end">10</span>
        </div>

        <div class="switch-row">
            <span class="sw-label">排除混淆字符 1lI0O</span>
            <div class="toggle on" id="toggleExclude" onclick="toggleSwitch('exclude')"></div>
        </div>
        <div class="switch-row">
            <span class="sw-label">不连续重复字符</span>
            <div class="toggle" id="toggleUnique" onclick="toggleSwitch('unique')"></div>
        </div>

        <div class="section-title">字符类型</div>
        <div class="seg">
            <button class="seg-btn active" data-type="lower" onclick="toggleSeg(this)">a-z<sub>小写</sub></button>
            <button class="seg-btn active" data-type="upper" onclick="toggleSeg(this)">A-Z<sub>大写</sub></button>
            <button class="seg-btn active" data-type="number" onclick="toggleSeg(this)">0-9<sub>数字</sub></button>
            <button class="seg-btn active" data-type="symbol" onclick="toggleSeg(this)">!@#<sub>符号</sub></button>
        </div>

        <button class="gen-btn" onclick="generate()" style="width:100%;margin-top:8px">生成密码</button>
    </div>
</div>

<!-- ====== 底部滚动区 ====== -->
<div class="bottom-area" id="bottomArea">

    <!-- 批量结果 -->
    <div class="card" id="batchCard" style="display:none">
        <div class="section-title">生成结果</div>
        <div class="batch-list" id="batchList"></div>
    </div>

    <!-- 历史 -->
    <div class="card">
        <div class="section-title">最近</div>
        <div class="history-list" id="historyList">
            <div class="empty">点击 🔄 生成</div>
        </div>
    </div>

</div>

<div class="toast" id="toastBar"><span></span></div>
<script src="main.js"></script>
</body>
</html>
