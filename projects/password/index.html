<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <link rel="icon" type="image/png" sizes="64x64" href="https://github.com/ATX8T.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://github.com/ATX8T.png">
    <title>密码生成器 · ATX8T</title>
    <style>
        :root {
            --bg: #f1f5f9;
            --card: #fff;
            --text: #0f172a;
            --text2: #64748b;
            --text3: #94a3b8;
            --border: #e2e8f0;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --green: #16a34a;
            --red: #dc2626;
            --orange: #ea580c;
            --radius: 12px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Nav */
        .nav {
            background: var(--card); border-bottom: 1px solid var(--border);
            padding: 0 24px; height: 52px; display: flex; align-items: center;
            justify-content: space-between; flex-shrink: 0;
        }
        .nav a { text-decoration:none; font-size:.88rem; font-weight:600; color:var(--text); display:flex; align-items:center; gap:10px; }
        .nav img { width:32px; height:32px; border-radius:50%; }
        .nav .back { color:var(--accent); font-size:.84rem; }

        /* Main */
        .main {
            flex:1; display:grid; grid-template-columns:1fr 360px;
            gap:20px; padding:20px 24px; max-width:1100px; width:100%; margin:0 auto;
            overflow:hidden;
        }
        @media(max-width:800px){ .main{grid-template-columns:1fr; overflow-y:auto;} }

        /* Card */
        .card {
            background: var(--card); border:1px solid var(--border);
            border-radius: var(--radius); padding:20px 24px;
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }

        /* === Left === */
        .left-col { display:flex; flex-direction:column; gap:16px; overflow:hidden; }

        .pw-display {
            font-family: 'JetBrains Mono','SF Mono','Consolas',monospace;
            font-size: 1.5rem; font-weight: 600; text-align: center;
            letter-spacing: .05em; word-break: break-all; line-height: 1.45;
            padding: 18px 20px; border-radius: 8px;
            background: #f8fafc; border: 1px solid var(--border);
            color: var(--text); user-select: all; cursor: text;
        }
        .pw-display.placeholder {
            font-family: 'Inter',-apple-system,sans-serif; font-size:.9rem;
            letter-spacing:0; color:var(--text3);
        }

        .pw-actions { display:flex; justify-content:center; gap:10px; margin-top:14px; }
        .btn {
            padding: 9px 22px; border-radius: 8px; border: none; cursor: pointer;
            font-size: .84rem; font-weight: 600; transition: all .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { background:var(--accent-hover); }
        .btn-primary:active { transform:scale(.97); }
        .btn-outline { background:var(--card); color:var(--text); border:1px solid var(--border); }
        .btn-outline:hover { border-color:var(--accent); color:var(--accent); }
        .btn-outline.copied { background:var(--green); color:#fff; border-color:var(--green); }
        .btn-outline.failed { background:var(--red); color:#fff; border-color:var(--red); }

        /* Strength */
        .strength-row { display:flex; align-items:center; gap:12px; margin-top:12px; }
        .strength-bar { flex:1; height:5px; border-radius:5px; background:#e2e8f0; overflow:hidden; }
        .strength-fill {
            height:100%; border-radius:5px;
            transition:width .4s ease, background .4s ease;
        }
        .strength-label { font-size:.8rem; font-weight:600; min-width:52px; text-align:right; }
        .strength-meta { font-size:.72rem; color:var(--text2); margin-top:4px; }

        /* Results */
        .result-area { flex:1; overflow-y:auto; }
        .result-area .batch-item {
            display:flex; align-items:center; gap:10px; padding:10px 14px;
            border-radius:8px; background:#f8fafc; border:1px solid var(--border);
            margin-bottom:6px;
        }
        .batch-pw {
            flex:1; font-family:'JetBrains Mono',monospace; font-size:.8rem;
            font-weight:500; word-break:break-all; letter-spacing:.03em;
            color:var(--text); user-select:all; cursor:text;
        }
        .batch-copy {
            font-size:.72rem; padding:5px 12px; border-radius:6px; border:1px solid var(--border);
            cursor:pointer; font-weight:500; background:var(--card); color:var(--text2);
            transition:all .15s; flex-shrink:0;
        }
        .batch-copy:hover { border-color:var(--accent); color:var(--accent); }
        .batch-copy.copied { background:var(--green); color:#fff; border-color:var(--green); }
        .batch-copy.failed { background:var(--red); color:#fff; border-color:var(--red); }

        .history-item {
            display:flex; align-items:center; gap:10px;
            padding:7px 0; border-bottom:1px solid var(--border);
        }
        .history-item:last-child { border-bottom:none; }
        .h-pw {
            font-family:'JetBrains Mono',monospace; font-size:.76rem;
            font-weight:500; flex:1; word-break:break-all; letter-spacing:.02em;
            user-select:all; cursor:text;
        }
        .h-time { font-size:.7rem; color:var(--text3); flex-shrink:0; min-width:50px; text-align:right; }
        .h-copy {
            font-size:.7rem; padding:3px 10px; border-radius:6px; border:1px solid var(--border);
            cursor:pointer; font-weight:500; background:var(--card); color:var(--text2);
            transition:all .15s; flex-shrink:0;
        }
        .h-copy:hover { border-color:var(--accent); color:var(--accent); }
        .h-copy.copied { background:var(--green); color:#fff; border-color:var(--green); }
        .h-copy.failed { background:var(--red); color:#fff; border-color:var(--red); }
        .empty { padding:16px 0; text-align:center; color:var(--text3); font-size:.82rem; }
        .clear-btn {
            font-size:.74rem; font-weight:500; color:var(--text2);
            background:none; border:1px solid var(--border); cursor:pointer;
            padding:4px 12px; border-radius:6px; transition:all .15s;
            -webkit-tap-highlight-color:transparent;
        }
        .clear-btn:hover { border-color:var(--red); color:var(--red); }

        /* === Right === */
        .right-col { display:flex; flex-direction:column; gap:16px; }

        .section-title {
            font-size: .7rem; font-weight: 700; color: var(--text2);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px;
        }

        .slider-row { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
        .slider-val {
            min-width: 44px; height: 30px; border-radius: 6px;
            background: #f1f5f9; display:flex; align-items:center; justify-content:center;
            font-size:.9rem; font-weight:700; color:var(--accent);
            border:1px solid var(--border);
        }
        input[type=range] {
            -webkit-appearance:none; flex:1; height:5px; border-radius:5px;
            background:var(--border); outline:none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance:none; width:20px; height:20px; border-radius:50%;
            background:var(--accent); cursor:pointer;
            border:2px solid #fff; box-shadow:0 1px 3px rgba(0,0,0,.15);
        }
        .range-end { font-size:.7rem; color:var(--text3); min-width:22px; text-align:right; }

        .seg { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:14px; }
        .seg-btn {
            padding:9px 4px; border-radius:8px; font-size:.78rem; font-weight:500;
            background:#f8fafc; color:var(--text2); border:1px solid var(--border);
            cursor:pointer; text-align:center; transition:all .15s;
            -webkit-tap-highlight-color:transparent;
        }
        .seg-btn:hover { border-color:var(--accent); color:var(--accent); }
        .seg-btn.active {
            background:var(--accent); color:#fff; border-color:var(--accent);
        }
        .seg-btn sub { font-size:.65rem; color:var(--text3); font-weight:400; display:block; margin-top:2px; }
        .seg-btn.active sub { color:rgba(255,255,255,.65); }

        .switch-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; }
        .switch-row .sw-label { font-size:.82rem; font-weight:500; color:var(--text); }
        .toggle {
            width:44px; height:25px; border-radius:25px;
            background:var(--border); cursor:pointer; position:relative;
            transition:background .25s; flex-shrink:0;
            -webkit-tap-highlight-color:transparent;
        }
        .toggle::after {
            content:''; position:absolute; width:21px; height:21px; border-radius:50%;
            background:#fff; top:2px; left:2px;
            box-shadow:0 1px 3px rgba(0,0,0,.15);
            transition:transform .25s cubic-bezier(.25,.8,.25,1.2);
        }
        .toggle.on { background: var(--accent); }
        .toggle.on::after { transform:translateX(19px); }

        /* Toast */
        .toast {
            position:fixed; top:24px; left:50%; transform:translateX(-50%); z-index:99999;
            background:#0f172a; color:#fff; padding:10px 24px; border-radius:8px;
            font-size:.82rem; font-weight:500; display:none;
            box-shadow:0 4px 20px rgba(0,0,0,.2); pointer-events:none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--border); border-radius:10px; }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/"><img src="https://github.com/ATX8T.png" alt=""> ATX8T</a>
    <a class="back" href="/">← 首页</a>
</nav>

<div class="main">

    <!-- Left -->
    <div class="left-col">

        <div class="card">
            <div class="pw-display placeholder" id="passwordText">配置右侧选项后点击生成</div>
            <div class="pw-actions">
                <button class="btn btn-outline" id="btnCopy" onclick="copyPassword()">复制密码</button>
            </div>
            <div class="strength-row">
                <div class="strength-bar"><div class="strength-fill" id="strengthBar"></div></div>
                <span class="strength-label" id="strengthText" style="color:var(--text3)">-</span>
            </div>
            <div class="strength-meta" id="strengthDetails"></div>
        </div>

        <div class="card result-area">
            <div style="display:flex; justify-content:flex-end; margin-bottom:4px">
                <button class="clear-btn" onclick="clearHistory()">清除记录</button>
            </div>
            <div class="batch-list" id="batchList" style="display:none"></div>
            <div class="history-list" id="historyList">
                <div class="empty">点击右侧生成密码</div>
            </div>
        </div>
    </div>

    <!-- Right -->
    <div class="right-col">
        <div class="card">
            <div class="section-title">密码长度</div>
            <div class="slider-row">
                <div class="slider-val" id="lengthValue">16</div>
                <input type="range" id="lengthSlider" min="6" max="64" value="16" oninput="onLengthChange(this.value)">
                <span class="range-end">64</span>
            </div>

            <div class="section-title">生成数量</div>
            <div class="slider-row">
                <div class="slider-val" id="countBadge">1</div>
                <input type="range" id="countSlider" min="1" max="10" value="1" oninput="onCountChange(this.value)">
                <span class="range-end">10</span>
            </div>

            <div class="switch-row">
                <span class="sw-label">排除混淆字符</span>
                <div class="toggle on" id="toggleExclude" onclick="toggleSwitch('exclude')"></div>
            </div>
            <div class="switch-row">
                <span class="sw-label">不连续重复</span>
                <div class="toggle" id="toggleUnique" onclick="toggleSwitch('unique')"></div>
            </div>

            <div class="section-title">字符类型</div>
            <div class="seg">
                <button class="seg-btn active" data-type="lower" onclick="toggleSeg(this)">a-z<sub>小写</sub></button>
                <button class="seg-btn active" data-type="upper" onclick="toggleSeg(this)">A-Z<sub>大写</sub></button>
                <button class="seg-btn active" data-type="number" onclick="toggleSeg(this)">0-9<sub>数字</sub></button>
                <button class="seg-btn active" data-type="symbol" onclick="toggleSeg(this)">!@#<sub>符号</sub></button>
            </div>

            <button class="btn btn-primary" onclick="generate()" style="width:100%">生成密码</button>
        </div>
    </div>

</div>

<div class="toast" id="toastBar"><span></span></div>
<script src="main.js"></script>
</body>
</html>
