<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>密码生成器 · ATX8T Lab</title>
    <style>
        :root {
            --bg: #f2f2f7; --card: rgba(255,255,255,.72); --text: #1d1d1f;
            --text-2: #6e6e73; --text-3: #aeaeb2; --sep: rgba(60,60,67,.08);
            --accent: #007aff; --red: #ff3b30; --orange: #ff9500; --green: #34c759;
            --fill: rgba(120,120,128,.12); --fill-2: rgba(120,120,128,.06);
            --radius: 14px;
        }
        * { margin:0;padding:0;box-sizing:border-box; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
            overflow: hidden;
        }

        /* ====== 导航 (紧凑) ====== */
        .nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 16px;
            background: rgba(242,242,247,.78);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: .5px solid var(--sep); flex-shrink: 0;
        }
        .nav a { text-decoration: none; font-size: .88rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 7px; }
        .nav img { width: 22px; height: 22px; border-radius: 50%; }
        .nav .back { color: var(--accent); font-weight: 500; }

        /* ====== 主区域 ====== */
        .main {
            flex: 1; display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; padding: 12px 16px; max-height: calc(100vh - 42px);
            overflow: hidden;
        }

        .card {
            background: var(--card);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border: .5px solid var(--sep); border-radius: var(--radius);
            padding: 14px 16px; display: flex; flex-direction: column;
            overflow: hidden;
        }

        /* ====== 左栏: 密码显示 + 设置 ====== */
        .left-col {
            grid-row: 1 / 3;
            display: flex; flex-direction: column; gap: 12px;
        }
        .left-col .card { flex: 1; }

        /* 密码显示区 */
        .pw-display {
            text-align: center;
            font-family: 'SF Mono','Menlo','Consolas',monospace;
            font-size: 1.35rem; font-weight: 600; letter-spacing: .06em;
            word-break: break-all; line-height: 1.3; flex: 1;
            display: flex; align-items: center; justify-content: center;
            user-select: all; cursor: text; min-height: 2em;
            padding: 4px 0;
        }
        .pw-display.placeholder { font-family: -apple-system,'SF Pro Text',sans-serif; font-size: 1rem; letter-spacing: 0; color: var(--text-3); }
        .pw-actions { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
        .pw-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            cursor: pointer; font-size: 1rem; background: var(--fill-2); color: var(--text);
            display: flex; align-items: center; justify-content: center;
            transition: all .2s cubic-bezier(.25,.8,.25,1.2); -webkit-tap-highlight-color: transparent;
        }
        .pw-btn:active { transform: scale(.88); background: var(--fill); }
        .pw-btn.copied { background: var(--green); color: #fff; transform: scale(1.05); }
        .pw-btn.failed { background: var(--red); color: #fff; }

        /* 强度 (内嵌) */
        .strength-inline {
            display: flex; align-items: center; gap: 8px; margin-top: 6px;
        }
        .strength-bar {
            flex: 1; height: 4px; border-radius: 4px; background: var(--fill-2); overflow: hidden;
        }
        .strength-fill {
            height: 100%; border-radius: 4px; transition: width .4s, background .4s;
        }
        .strength-word { font-size: .75rem; font-weight: 600; min-width: 44px; text-align: right; }
        .strength-meta { font-size: .68rem; color: var(--text-2); margin-top: 3px; }

        /* ====== 设置卡片 ====== */
        .section-title {
            font-size: .68rem; font-weight: 600; color: var(--text-2);
            text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px;
        }

        /* 长度滑块 */
        .len-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .len-val {
            min-width: 34px; height: 28px; border-radius: 7px; background: var(--fill-2);
            display: flex; align-items: center; justify-content: center;
            font-size: .9rem; font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0;
        }
        input[type=range] {
            -webkit-appearance: none; flex: 1; height: 5px; border-radius: 5px;
            background: var(--fill); outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 22px; height: 22px;
            border-radius: 50%; background: #fff;
            border: .5px solid rgba(0,0,0,.08);
            box-shadow: 0 2px 6px rgba(0,0,0,.1); cursor: pointer;
        }

        /* 分段选择器 */
        .seg {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px;
        }
        .seg-btn {
            padding: 7px 4px; border-radius: 8px; font-size: .76rem; font-weight: 500;
            background: var(--fill-2); color: var(--text-2); border: none;
            cursor: pointer; text-align: center; transition: all .15s;
            -webkit-tap-highlight-color: transparent;
        }
        .seg-btn.active { background: var(--accent); color: #fff; }
        .seg-btn sub { font-size: .65rem; color: var(--text-3); font-weight: 400; display: block; margin-top: 1px; }
        .seg-btn.active sub { color: rgba(255,255,255,.65); }

        /* 开关 */
        .switch-row {
            display: flex; align-items: center; justify-content: space-between; padding: 4px 0;
        }
        .switch-row .sw-label { font-size: .78rem; font-weight: 500; }
        .toggle {
            width: 42px; height: 25px; border-radius: 25px; background: var(--fill);
            cursor: pointer; position: relative; transition: background .25s; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .toggle::after {
            content: ''; position: absolute; width: 21px; height: 21px; border-radius: 50%;
            background: #fff; top: 2px; left: 2px;
            box-shadow: 0 1px 3px rgba(0,0,0,.12);
            transition: transform .25s cubic-bezier(.25,.8,.25,1.2);
        }
        .toggle.on { background: var(--green); }
        .toggle.on::after { transform: translateX(17px); }

        /* 步进器 */
        .stepper { display: flex; align-items: center; gap: 12px; }
        .step-btn {
            width: 28px; height: 28px; border-radius: 50%; background: var(--fill-2);
            border: none; cursor: pointer; font-size: .9rem; color: var(--accent); font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            transition: all .12s; -webkit-tap-highlight-color: transparent;
        }
        .step-btn:active { background: var(--fill); transform: scale(.88); }
        .step-val { font-size: .95rem; font-weight: 600; min-width: 20px; text-align: center; }

        /* ====== 右栏 ====== */
        .right-col {
            display: flex; flex-direction: column; gap: 12px;
            overflow: hidden;
        }

        /* 批量结果 (紧凑) */
        .batch-list { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; flex: 1; }
        .batch-item {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 10px; border-radius: 8px; background: var(--fill-2);
        }
        .batch-pw {
            flex: 1; font-family: 'SF Mono','Menlo',monospace;
            font-size: .75rem; font-weight: 500; word-break: break-all; letter-spacing: .03em;
        }
        .batch-copy {
            font-size: .7rem; padding: 4px 10px; border-radius: 14px;
            border: none; cursor: pointer; font-weight: 500;
            background: rgba(0,122,255,.12); color: var(--accent);
            transition: all .2s cubic-bezier(.25,.8,.25,1.2); flex-shrink: 0;
        }
        .batch-copy:active { background: rgba(0,122,255,.22); transform: scale(.93); }
        .batch-copy.copied { background: var(--green); color: #fff; }
        .batch-copy.failed { background: var(--red); color: #fff; }

        /* 历史 (紧凑) */
        .history-list { overflow-y: auto; }
        .history-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 6px 0; border-bottom: .5px solid var(--sep); gap: 8px;
        }
        .history-item:last-child { border-bottom: none; }
        .h-pw {
            font-family: 'SF Mono','Menlo',monospace; font-size: .72rem;
            font-weight: 500; flex: 1; word-break: break-all; letter-spacing: .02em;
        }
        .h-copy {
            font-size: .68rem; padding: 3px 10px; border-radius: 12px;
            border: none; cursor: pointer; font-weight: 500;
            background: rgba(0,122,255,.12); color: var(--accent);
            transition: all .2s cubic-bezier(.25,.8,.25,1.2); flex-shrink: 0;
        }
        .h-copy:active { background: rgba(0,122,255,.22); }
        .h-copy.copied { background: var(--green); color: #fff; }
        .h-copy.failed { background: var(--red); color: #fff; }
        .empty { padding: 12px 0; text-align: center; color: var(--text-3); font-size: .78rem; }

        /* Toast */
        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999;
            background: rgba(30,30,32,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #fff; padding: 8px 18px; border-radius: 20px;
            font-size: .8rem; font-weight: 500; display: none;
            box-shadow: 0 4px 16px rgba(0,0,0,.15);
        }

        @media (max-width: 640px) {
            .main { grid-template-columns: 1fr; overflow-y: auto; max-height: none; }
            body { overflow: auto; }
            .left-col { grid-row: auto; }
            .right-col { max-height: 300px; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="/"><img src="https://github.com/ATX8T.png" alt=""> ATX8T Lab</a>
    <a class="back" href="/">← 首页</a>
</nav>

<div class="main">

    <!-- ====== 左栏 ====== -->
    <div class="left-col">

        <!-- 密码显示 -->
        <div class="card" style="flex:0 0 auto">
            <div class="pw-display placeholder" id="passwordText">生成密码</div>
            <div class="pw-actions">
                <button class="pw-btn" onclick="generate()">🔄</button>
                <button class="pw-btn" id="btnCopy" onclick="copyPassword()">📋</button>
            </div>
            <div class="strength-inline">
                <div class="strength-bar"><div class="strength-fill" id="strengthBar"></div></div>
                <span class="strength-word" id="strengthText" style="color:var(--text-3)">-</span>
            </div>
            <div class="strength-meta" id="strengthDetails"></div>
        </div>

        <!-- 设置 -->
        <div class="card" style="overflow-y:auto">
            <div class="section-title">长度</div>
            <div class="len-row">
                <div class="len-val" id="lengthValue">16</div>
                <input type="range" id="lengthSlider" min="6" max="64" value="16" oninput="onLengthChange(this.value)">
            </div>

            <div class="section-title">字符类型</div>
            <div class="seg">
                <button class="seg-btn active" data-type="lower" onclick="toggleSeg(this)">a-z<sub>小写</sub></button>
                <button class="seg-btn active" data-type="upper" onclick="toggleSeg(this)">A-Z<sub>大写</sub></button>
                <button class="seg-btn active" data-type="number" onclick="toggleSeg(this)">0-9<sub>数字</sub></button>
                <button class="seg-btn active" data-type="symbol" onclick="toggleSeg(this)">!@#<sub>符号</sub></button>
            </div>

            <div class="section-title">选项</div>
            <div class="switch-row">
                <span class="sw-label">排除混淆字符 1lI0O</span>
                <div class="toggle on" id="toggleExclude" onclick="toggleSwitch('exclude')"></div>
            </div>
            <div class="switch-row">
                <span class="sw-label">不连续重复</span>
                <div class="toggle" id="toggleUnique" onclick="toggleSwitch('unique')"></div>
            </div>

            <div class="section-title" style="margin-top:4px">数量</div>
            <div class="stepper">
                <button class="step-btn" onclick="changeCount(-1)">−</button>
                <span class="step-val" id="stepperVal">1</span>
                <button class="step-btn" onclick="changeCount(1)">+</button>
                <span style="font-size:.76rem;color:var(--text-2)">个</span>
            </div>
        </div>
    </div>

    <!-- ====== 右栏 ====== -->
    <div class="right-col">

        <!-- 批量结果 -->
        <div class="card" id="batchCard" style="display:none">
            <div class="section-title">生成结果</div>
            <div class="batch-list" id="batchList"></div>
        </div>

        <!-- 历史 -->
        <div class="card" style="flex:1;overflow:hidden">
            <div class="section-title">最近</div>
            <div class="history-list" id="historyList">
                <div class="empty">点击 🔄 生成</div>
            </div>
        </div>
    </div>

</div>

<div class="toast" id="toastBar"><span></span></div>
<script src="main.js"></script>
</body>
</html>
