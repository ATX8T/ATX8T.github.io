<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <link rel="icon" href="https://github.com/ATX8T.png">
    <title>ATX8T</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <style>
        :root {
            --bg: #f5f6fa;
            --card-bg: #fff;
            --text: #1a1a2e;
            --text-muted: #636e72;
            --border: #e8ecf1;
            --accent: #3b6df0;
            --accent2: #7c3aed;
            --green: #10b981;
            --orange: #f59e0b;
            --radius: 14px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 16px rgba(0,0,0,.06);
            --shadow-lg: 0 12px 32px rgba(0,0,0,.08);
        }

        * { box-sizing: border-box; }
        body {
            background: var(--bg);
            background-image: url('https://pub-344a25be3ffd49d490c19303e80f71f5.r2.dev/GitHub%20pages%E4%B8%93%E7%94%A8/1782480440485_m89hei.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            line-height: 1.6;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(245,246,250,.45);
            backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
            z-index: 0; pointer-events: none;
        }
        /* 确保内容在蒙层之上 */
        .navbar, .container, .hero, .project-grid, .site-footer { position: relative; z-index: 1; }
            -webkit-font-smoothing: antialiased;
        }

        /* === 导航 === */
        .navbar {
            background: rgba(255,255,255,.78);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-bottom: 1px solid rgba(0,0,0,.06);
            position: sticky; top: 0; z-index: 100;
        }
        .navbar-brand {
            font-weight: 800; font-size: 1.3rem; letter-spacing: -.02em;
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text);
        }
        .navbar-brand img {
            width: 30px; height: 30px; border-radius: 50%;
        }
        .nav-link-right { font-size: .85rem; color: var(--text-muted); text-decoration: none; transition: color .2s; }
        .nav-link-right:hover { color: var(--accent); }
        .nav-right { display: flex; align-items: center; gap: 14px; }
        .settings-btn {
            width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--card-bg); cursor: pointer; font-size: .9rem;
            display: flex; align-items: center; justify-content: center;
            transition: all .2s; -webkit-tap-highlight-color: transparent;
        }
        .settings-btn:hover { border-color: var(--accent); color: var(--accent); }
        .settings-panel {
            position: fixed; top: 56px; right: 16px; z-index: 200;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 18px 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,.12);
            min-width: 260px; display: none;
        }
        .settings-panel.show { display: block; }
        .settings-panel .set-title { font-size: .78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 14px; }
        .settings-panel .set-row { margin-bottom: 14px; }
        .settings-panel .set-row:last-child { margin-bottom: 0; }
        .settings-panel .set-label { font-size: .8rem; font-weight: 500; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .settings-panel .set-val { font-size: .8rem; color: var(--accent); font-weight: 600; }
        .settings-panel input[type=range] {
            -webkit-appearance: none; width: 100%; height: 5px; border-radius: 5px;
            background: var(--fill); outline: none;
        }
        .settings-panel input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: var(--accent); cursor: pointer;
        }

        /* === Hero === */
        .hero {
            padding: 72px 0 48px;
            text-align: center;
            position: relative;
        }
        .hero-badge {
            display: inline-block;
            font-size: .78rem; font-weight: 600;
            padding: 5px 14px;
            border-radius: 50px;
            background: rgba(59,109,240,.08);
            color: var(--accent);
            margin-bottom: 20px;
            letter-spacing: .02em;
        }
        .hero h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 850;
            letter-spacing: -.03em;
            line-height: 1.15;
            margin-bottom: 14px;
        }
        .hero h1 .gradient {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 50%, #e040fb 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .subtitle {
            color: var(--text-muted);
            font-size: 1.08rem;
            max-width: 480px;
            margin: 0 auto 28px;
            line-height: 1.6;
        }
        .hero-stats {
            display: flex; justify-content: center; gap: 32px;
            font-size: .85rem; color: var(--text-muted);
        }
        .hero-stats strong { color: var(--text); font-size: 1.15rem; }

        /* === 区域标题 === */
        .section-header {
            display: flex; align-items: baseline; justify-content: space-between;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: .8rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: .08em;
            color: var(--text-muted);
        }

        /* === 项目网格 === */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
            margin-bottom: 48px;
        }
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 26px 24px 22px;
            text-decoration: none; color: var(--text);
            display: flex; flex-direction: column; gap: 10px;
            transition: all .25s cubic-bezier(.4,0,.2,1);
            position: relative; overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .project-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            opacity: 0; transition: opacity .25s;
        }
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: #ccd8f0;
        }
        .project-card:hover::before { opacity: 1; }

        .project-card .card-top {
            display: flex; align-items: center; gap: 12px;
        }
        .project-card .icon-box {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .icon-blue { background: #eef2ff; }
        .icon-green { background: #ecfdf5; }
        .icon-orange { background: #fffbeb; }
        .icon-purple { background: #f5f3ff; }

        .project-card .name {
            font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em;
        }
        .project-card .desc {
            font-size: .84rem; color: var(--text-muted); line-height: 1.55;
        }
        .project-card .card-bottom {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: auto; padding-top: 4px;
        }
        .project-card .tags {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .project-card .tag {
            font-size: .68rem; font-weight: 500;
            padding: 3px 10px; border-radius: 20px;
            background: #f1f5f9; color: #475569;
            letter-spacing: .01em;
        }
        .project-card .arrow {
            font-size: .85rem; color: var(--text-muted);
            transition: transform .2s, color .2s;
        }
        .project-card:hover .arrow {
            transform: translateX(3px); color: var(--accent);
        }

        /* === Footer === */
        .site-footer {
            text-align: center; padding: 32px 0;
            border-top: 1px solid var(--border);
        }
        .site-footer .footer-brand {
            font-weight: 700; font-size: .9rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; margin-bottom: 4px;
        }
        .site-footer .footer-links {
            display: flex; justify-content: center; gap: 20px;
            margin-bottom: 8px;
        }
        .site-footer .footer-links a {
            font-size: .8rem; color: var(--text-muted); text-decoration: none; transition: color .2s;
        }
        .site-footer .footer-links a:hover { color: var(--accent); }
        .site-footer .copyright {
            font-size: .75rem; color: #b0b7c3;
        }

        /* === 骨架屏 === */
        .skeleton-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 26px 24px;
            animation: pulse 1.8s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: .4; }
            50% { opacity: .7; }
        }
        .skeleton-line { height: 12px; background: #e8ecf1; border-radius: 6px; margin-bottom: 10px; }
        .skeleton-line.short { width: 60%; }
        .skeleton-line.medium { width: 80%; }

        @media (max-width: 640px) {
            .hero { padding: 48px 0 32px; }
            .project-grid { grid-template-columns: 1fr; }
            .hero-stats { gap: 20px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container d-flex justify-content-between align-items-center py-2">
        <a class="navbar-brand" href="/"><img src="https://github.com/ATX8T.png" alt=""> ATX8T</a>
        <div class="nav-right">
            <button class="settings-btn" onclick="toggleSettings()" title="页面设置">⚙️</button>
            <a class="nav-link-right" href="https://github.com/ATX8T/ATX8T.github.io" target="_blank">GitHub →</a>
        </div>
    </div>
</nav>

<div class="container">

    <!-- ====== Hero ====== -->
    <div class="hero">
        <div class="hero-badge">🚀 Open Source Toolkit</div>
        <h1>GitHub 资源<span class="gradient">一站管理</span></h1>
        <p class="subtitle" id="siteDesc">
            链接转换、资源浏览、图床加速 — 全部在浏览器端完成，无需登录
        </p>
        <div class="hero-stats">
            <div><strong id="projectCount">-</strong><br><span class="text-muted">工具数</span></div>
            <div><strong>🆓</strong><br><span class="text-muted">免费使用</span></div>
            <div><strong>⚡</strong><br><span class="text-muted">纯前端</span></div>
        </div>
    </div>

    <!-- ====== 工具列表 ====== -->
    <div class="section-header">
        <span class="section-title">🧩 全部工具</span>
        <span style="font-size:.78rem;color:var(--text-muted)">点击卡片进入 →</span>
    </div>

    <div class="project-grid" id="projectGrid">
        <!-- JS 动态生成 -->
    </div>

    <!-- 骨架屏 -->
    <div class="project-grid" id="skeletonGrid">
        <div class="skeleton-card"><div class="skeleton-line" style="width:40px;height:40px;border-radius:10px"></div><div class="skeleton-line short" style="margin-top:14px"></div><div class="skeleton-line medium"></div></div>
        <div class="skeleton-card"><div class="skeleton-line" style="width:40px;height:40px;border-radius:10px"></div><div class="skeleton-line short" style="margin-top:14px"></div><div class="skeleton-line medium"></div></div>
    </div>

    <!-- ====== Footer ====== -->
    <div class="site-footer">
        <div class="footer-brand" id="footerBrand"></div>
        <div class="footer-links">
            <a href="https://github.com/ATX8T/ATX8T.github.io" target="_blank">📂 源代码</a>
            <a href="README.md">📖 开发规范</a>
        </div>
        <div class="copyright" id="footerText"></div>
    </div>
</div>

<!-- 页面设置面板 -->
<div class="settings-panel" id="settingsPanel">
    <div class="set-title">⚙️ 页面设置</div>
    <div class="set-row">
        <div class="set-label"><span>背景透明度</span><span class="set-val" id="opacityVal">55%</span></div>
        <input type="range" min="10" max="95" value="55" oninput="updateOpacity(this.value)">
    </div>
    <div class="set-row">
        <div class="set-label"><span>背景模糊度</span><span class="set-val" id="blurVal">2px</span></div>
        <input type="range" min="0" max="10" value="2" oninput="updateBlur(this.value)">
    </div>
    <div class="set-row">
        <div class="set-label"><span>卡顿字体</span><span class="set-val" id="cardFontVal">默认</span></div>
        <input type="range" min="12" max="18" value="14" oninput="updateCardFont(this.value)" style="display:none">
    </div>
</div>

<script>
var iconColors = ['icon-blue', 'icon-green', 'icon-orange', 'icon-purple'];

fetch('projects.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
        // 站点信息
        if (data.site) {
            document.title = data.site.title;
            document.getElementById('siteDesc').textContent = data.site.desc;
            document.getElementById('footerText').textContent = data.site.footer || 'Powered by GitHub Pages';
            document.getElementById('footerBrand').textContent = data.site.title;
        }

        // 渲染卡片
        var grid = document.getElementById('projectGrid');
        grid.innerHTML = '';

        (data.projects || []).forEach(function(p, i) {
            var card = document.createElement('a');
            card.className = 'project-card';
            card.href = p.path;

            var colorClass = iconColors[i % iconColors.length];

            var tagsHtml = (p.tags || []).slice(0, 4).map(function(t) {
                return '<span class="tag">' + t + '</span>';
            }).join('');

            card.innerHTML =
                '<div class="card-top">' +
                    '<div class="icon-box ' + colorClass + '">' + (p.icon || '📦') + '</div>' +
                    '<div class="name">' + p.name + '</div>' +
                '</div>' +
                '<div class="desc">' + p.desc + '</div>' +
                '<div class="card-bottom">' +
                    '<div class="tags">' + tagsHtml + '</div>' +
                    '<span class="arrow">→</span>' +
                '</div>';

            grid.appendChild(card);
        });

        // 更新统计数
        document.getElementById('projectCount').textContent = data.projects.length;

        // 移除骨架屏
        var sk = document.getElementById('skeletonGrid');
        if (sk) sk.remove();
    })
    .catch(function() {
        document.getElementById('projectGrid').innerHTML =
            '<div class="project-card" style="text-align:center;padding:40px"><div style="font-size:2rem;margin-bottom:8px">⚠️</div><div class="name">加载失败</div><div class="desc">请检查 projects.json 是否存在</div></div>';
        var sk = document.getElementById('skeletonGrid');
        if (sk) sk.remove();
    });

    // ====== 页面设置面板 ======
    var overlay = document.querySelector('body::before'); // can't select pseudo, use style
    function setOverlay(opacity, blur) {
        var style = document.getElementById('overlayStyle');
        if (!style) {
            style = document.createElement('style');
            style.id = 'overlayStyle';
            document.head.appendChild(style);
        }
        style.textContent = 'body::before { background: rgba(245,246,250,' + (opacity/100) + ')!important; backdrop-filter: blur(' + blur + 'px)!important; -webkit-backdrop-filter: blur(' + blur + 'px)!important; }';
    }

    // 读取保存的设置
    var savedOpacity = localStorage.getItem('bgOpacity') || 55;
    var savedBlur = localStorage.getItem('bgBlur') || 2;
    setOverlay(savedOpacity, savedBlur);
    document.getElementById('opacityVal').textContent = Math.round(savedOpacity) + '%';
    document.getElementById('blurVal').textContent = savedBlur + 'px';

    window.toggleSettings = function() {
        document.getElementById('settingsPanel').classList.toggle('show');
    };
    window.updateOpacity = function(v) {
        document.getElementById('opacityVal').textContent = v + '%';
        localStorage.setItem('bgOpacity', v);
        var blur = localStorage.getItem('bgBlur') || 2;
        setOverlay(v, blur);
    };
    window.updateBlur = function(v) {
        document.getElementById('blurVal').textContent = v + 'px';
        localStorage.setItem('bgBlur', v);
        var opacity = localStorage.getItem('bgOpacity') || 55;
        setOverlay(opacity, v);
    };

    // 点击其他地方关闭面板
    document.addEventListener('click', function(e) {
        var panel = document.getElementById('settingsPanel');
        var btn = document.querySelector('.settings-btn');
        if (panel && btn && !panel.contains(e.target) && !btn.contains(e.target)) {
            panel.classList.remove('show');
        }
    });
</script>

</body>
</html>
