<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" type="image/png" sizes="64x64" href="https://github.com/ATX8T.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://github.com/ATX8T.png">
    <title>ATX8T</title>
    <style>
        :root {
            --radius: 18px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: #0a0a14;
            background-image: url('https://pub-344a25be3ffd49d490c19303e80f71f5.r2.dev/GitHub%20pages%E4%B8%93%E7%94%A8/1782480440485_m89hei.png');
            background-size: cover; background-position: center;
            background-attachment: fixed; background-repeat: no-repeat;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            min-height: 100vh; -webkit-font-smoothing: antialiased;
        }
        body::before {
            content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background: rgba(0,0,0,.45);
        }

        /* Nav */
        .navbar {
            position: sticky; top:0; z-index:100;
            background: rgba(0,0,0,.35);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,.08);
            padding: 10px 0;
        }
        .nav-inner {
            max-width:1100px; margin:0 auto; padding:0 20px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .nav-brand {
            font-weight:700; font-size:1.15rem; color:#fff;
            text-decoration:none; display:flex; align-items:center; gap:10px;
        }
        .nav-brand img { width:38px; height:38px; border-radius:50%; }
        .nav-right { display:flex; align-items:center; gap:16px; }
        .nav-icon {
            width:34px; height:34px; border-radius:50%;
            background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1);
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            font-size:.9rem; color:rgba(255,255,255,.7); transition:all .2s;
            -webkit-tap-highlight-color:transparent;
        }
        .nav-icon:hover { background:rgba(255,255,255,.15); color:#fff; }
        .nav-link { font-size:.85rem; color:rgba(255,255,255,.6); text-decoration:none; font-weight:500; transition:color .2s; }
        .nav-link:hover { color:#fff; }

        /* Main */
        .main { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:0 20px; }

        /* Hero */
        .hero { text-align:center; padding:80px 0 60px; }
        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.2rem); font-weight:800;
            letter-spacing:-.03em; margin-bottom:12px;
            background:linear-gradient(135deg,#fff 0%,#c4b5fd 50%,#818cf8 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
            background-clip:text;
        }
        .hero p { font-size:1.05rem; color:rgba(255,255,255,.55); max-width:460px; margin:0 auto 24px; line-height:1.55; }

        /* Cards */
        .section-title {
            font-size:.72rem; font-weight:700; text-transform:uppercase;
            letter-spacing:.08em; color:rgba(255,255,255,.35); margin-bottom:18px;
        }
        .project-grid {
            display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr));
            gap:18px; margin-bottom:60px;
        }
        .project-card {
            background: rgba(255,255,255,.06);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: var(--radius); padding: 28px 26px;
            text-decoration:none; color:#fff; display:flex; flex-direction:column; gap:10px;
            transition: all .3s cubic-bezier(.4,0,.2,1);
            position:relative; overflow:hidden;
        }
        .project-card::after {
            content:''; position:absolute; top:0; left:0; right:0; height:1px;
            background:linear-gradient(90deg, transparent, rgba(255,255,255,.15), transparent);
            opacity:0; transition:opacity .3s;
        }
        .project-card:hover {
            background:rgba(255,255,255,.1);
            border-color:rgba(255,255,255,.15);
            transform:translateY(-4px);
            box-shadow:0 12px 40px rgba(0,0,0,.3);
        }
        .project-card:hover::after { opacity:1; }
        .card-top { display:flex; align-items:center; gap:14px; }
        .card-icon {
            width:48px; height:48px; border-radius:14px;
            background:rgba(255,255,255,.1); display:flex;
            align-items:center; justify-content:center; font-size:1.5rem;
            flex-shrink:0; backdrop-filter:blur(8px);
        }
        .card-name { font-size:1.05rem; font-weight:700; letter-spacing:-.01em; }
        .card-desc { font-size:.84rem; color:rgba(255,255,255,.45); line-height:1.5; }
        .card-bottom { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:4px; }
        .card-tags { display:flex; flex-wrap:wrap; gap:6px; }
        .card-tag {
            font-size:.68rem; font-weight:500; padding:4px 10px; border-radius:20px;
            background:rgba(255,255,255,.06); color:rgba(255,255,255,.5);
            border:1px solid rgba(255,255,255,.06);
        }
        .card-arrow { font-size:.85rem; color:rgba(255,255,255,.3); transition:all .2s; }
        .project-card:hover .card-arrow { color:rgba(255,255,255,.7); transform:translateX(3px); }

        /* Footer */
        .footer {
            text-align:center; padding:40px 0; border-top:1px solid rgba(255,255,255,.06);
        }
        .footer-brand { font-weight:700; font-size:.9rem; background:linear-gradient(135deg,#fff,#c4b5fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; margin-bottom:8px; }
        .footer-links { display:flex; justify-content:center; gap:20px; margin-bottom:8px; }
        .footer-links a { font-size:.8rem; color:rgba(255,255,255,.35); text-decoration:none; transition:color .2s; }
        .footer-links a:hover { color:#fff; }
        .copyright { font-size:.72rem; color:rgba(255,255,255,.2); }

        /* Settings */
        .settings-panel {
            position:fixed; top:56px; right:20px; z-index:200;
            background:rgba(20,20,30,.92); backdrop-filter:blur(24px);
            -webkit-backdrop-filter:blur(24px);
            border:1px solid rgba(255,255,255,.1); border-radius:var(--radius);
            padding:20px; min-width:250px; display:none;
            box-shadow:0 8px 40px rgba(0,0,0,.5);
        }
        .settings-panel.show { display:block; }
        .settings-panel .set-title { font-size:.76rem; font-weight:700; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.04em; margin-bottom:16px; }
        .settings-panel .set-row { margin-bottom:14px; }
        .settings-panel .set-row:last-child { margin-bottom:0; }
        .settings-panel .set-label { font-size:.8rem; font-weight:500; margin-bottom:4px; display:flex; justify-content:space-between; color:rgba(255,255,255,.7); }
        .settings-panel .set-val { font-size:.8rem; color:#818cf8; font-weight:600; }
        .settings-panel input[type=range] {
            -webkit-appearance:none; width:100%; height:4px; border-radius:4px;
            background:rgba(255,255,255,.1); outline:none;
        }
        .settings-panel input[type=range]::-webkit-slider-thumb {
            -webkit-appearance:none; width:18px; height:18px; border-radius:50%;
            background:#818cf8; cursor:pointer;
        }

        /* Skeleton */
        .sk-card {
            background:rgba(255,255,255,.04); border-radius:var(--radius);
            padding:28px 26px; animation:pulse 1.8s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.6} }

        @media(max-width:640px) {
            .hero { padding:50px 0 40px; }
            .project-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-inner">
        <a class="nav-brand" href="/"><img src="https://github.com/ATX8T.png" alt=""> ATX8T</a>
        <div class="nav-right">
            <button class="nav-icon" onclick="toggleSettings()" title="设置">⚙️</button>
            <a class="nav-link" href="https://github.com/ATX8T/ATX8T.github.io" target="_blank">GitHub →</a>
        </div>
    </div>
</nav>

<div class="main">

    <div class="hero">
        <h1>ATX8T</h1>
        <p id="siteDesc">GitHub 资源一站管理 — 链接转换、密码生成，全部在浏览器端完成</p>
    </div>

    <div class="section-title">🧩 工具</div>
    <div class="project-grid" id="projectGrid"></div>
    <div class="project-grid" id="skeletonGrid">
        <div class="sk-card"></div><div class="sk-card"></div>
    </div>

    <div class="footer">
        <div class="footer-brand" id="footerBrand"></div>
        <div class="footer-links">
            <a href="https://github.com/ATX8T/ATX8T.github.io" target="_blank">📂 源代码</a>
        </div>
        <div class="copyright" id="footerText"></div>
        <div class="copyright" style="margin-top:4px;color:rgba(255,255,255,.4);font-family:'Consolas',monospace;font-size:.68rem;">🔄 v2026.07.26-3</div>
    </div>
</div>

<div class="settings-panel" id="settingsPanel">
    <div class="set-title">⚙️ 页面设置</div>
    <div class="set-row">
        <div class="set-label"><span>背景暗度</span><span class="set-val" id="darkVal">45%</span></div>
        <input type="range" min="10" max="95" value="45" oninput="updateDark(this.value)">
    </div>
    <div class="set-row">
        <div class="set-label"><span>模糊度</span><span class="set-val" id="blurVal">0px</span></div>
        <input type="range" min="0" max="10" value="0" oninput="updateBlur(this.value)">
    </div>
</div>

<script>
// ====== 项目加载 ======
fetch('projects.json?v=20260726-3')
    .then(function(r){return r.json()})
    .then(function(d){
        if(d.site){
            document.title=d.site.title;
            document.getElementById('siteDesc').textContent=d.site.desc;
            document.getElementById('footerText').textContent=d.site.footer||'';
            document.getElementById('footerBrand').textContent=d.site.title;
        }
        var g=document.getElementById('projectGrid'); g.innerHTML='';
        (d.projects||[]).forEach(function(p){
            var c=document.createElement('a'); c.className='project-card'; c.href=p.path;
            c.innerHTML=
                '<div class="card-top"><div class="card-icon">'+(p.icon||'📦')+'</div><div class="card-name">'+p.name+'</div></div>'+
                '<div class="card-desc">'+p.desc+'</div>'+
                '<div class="card-bottom">'+
                    '<div class="card-tags">'+(p.tags||[]).slice(0,4).map(function(t){return '<span class="card-tag">'+t+'</span>'}).join('')+'</div>'+
                    '<span class="card-arrow">→</span>'+
                '</div>';
            g.appendChild(c);
        });
        var s=document.getElementById('skeletonGrid'); if(s)s.remove();
    })
    .catch(function(){
        document.getElementById('projectGrid').innerHTML='<div class="project-card"><div style="font-size:2rem;margin-bottom:8px">⚠️</div><div class="card-name">加载失败</div></div>';
        var s=document.getElementById('skeletonGrid'); if(s)s.remove();
    });

// ====== 设置面板 ======
function setStyle(opacity,blur){
    var s=document.getElementById('ovStyle');
    if(!s){s=document.createElement('style');s.id='ovStyle';document.head.appendChild(s);}
    s.textContent='body::before{background:rgba(0,0,0,'+(opacity/100)+')!important'+(blur>0?';backdrop-filter:blur('+blur+'px)!important;-webkit-backdrop-filter:blur('+blur+'px)!important':'')+'}';
}
var svO=localStorage.getItem('bgDark')||45, svB=localStorage.getItem('bgBlur2')||0;
setStyle(svO,svB);
document.getElementById('darkVal').textContent=svO+'%';
document.getElementById('blurVal').textContent=svB+'px';
window.toggleSettings=function(){document.getElementById('settingsPanel').classList.toggle('show')};
window.updateDark=function(v){document.getElementById('darkVal').textContent=v+'%';localStorage.setItem('bgDark',v);setStyle(v,localStorage.getItem('bgBlur2')||0)};
window.updateBlur=function(v){document.getElementById('blurVal').textContent=v+'px';localStorage.setItem('bgBlur2',v);setStyle(localStorage.getItem('bgDark')||45,v)};
document.addEventListener('click',function(e){var p=document.getElementById('settingsPanel'),b=document.querySelector('.nav-icon');if(p&&b&&!p.contains(e.target)&&!b.contains(e.target))p.classList.remove('show')});
</script>

</body>
</html>
