<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片画廊 - GitHub Image Gallery</title>
    <link rel="stylesheet" href="bootstra538dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/gallery.css">
</head>
<body class="bg-dark text-light">

    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                📷 GitHub Image Gallery
            </a>
            <span class="navbar-text text-secondary small">云端图床 · 基于 GitHub API</span>
        </div>
    </nav>

    <!-- 工具栏 -->
    <div class="container mt-3 mb-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="d-flex align-items-center gap-2">
                <button id="btnRefresh" class="btn btn-outline-light btn-sm" onclick="loadImages()">
                    🔄 刷新
                </button>
                <span id="imageCount" class="badge bg-secondary">0 张</span>
            </div>
            <div>
                <button class="btn btn-success btn-sm" onclick="document.getElementById('uploadInput').click()">
                    ⬆️ 上传图片
                </button>
                <input type="file" id="uploadInput" accept="image/*" multiple hidden>
                <button class="btn btn-outline-info btn-sm" data-bs-toggle="collapse" data-bs-target="#configPanel">
                    ⚙️ 设置
                </button>
            </div>
        </div>

        <!-- 配置面板 -->
        <div class="collapse mt-3" id="configPanel">
            <div class="card bg-secondary text-light border-secondary">
                <div class="card-body">
                    <h6 class="card-title">仓库配置</h6>
                    <div class="row g-2">
                        <div class="col-md-4">
                            <label class="form-label small">仓库所有者</label>
                            <input id="cfgOwner" class="form-control form-control-sm bg-dark text-light border-secondary" value="ATX8T" placeholder="your-username">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">仓库名</label>
                            <input id="cfgRepo" class="form-control form-control-sm bg-dark text-light border-secondary" value="ATX8T.github.io" placeholder="repo-name">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">图片路径 (分支或子目录)</label>
                            <input id="cfgPath" class="form-control form-control-sm bg-dark text-light border-secondary" value="images" placeholder="images">
                        </div>
                    </div>
                    <div class="mt-2">
                        <button class="btn btn-primary btn-sm" onclick="saveAndReload()">保存并加载</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="container">
        <!-- 加载中 -->
        <div id="loading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
            <p class="mt-2 text-secondary">正在从 GitHub 加载图片...</p>
        </div>

        <!-- 错误提示 -->
        <div id="errorBox" class="alert alert-danger d-none" role="alert">
            <h5 class="alert-heading">⚠️ 加载失败</h5>
            <p id="errorMsg"></p>
            <button class="btn btn-outline-danger btn-sm" onclick="loadImages()">重试</button>
        </div>

        <!-- 图片网格 -->
        <div id="gallery" class="row g-3">
            <!-- 动态填充 -->
        </div>

        <!-- 空状态 -->
        <div id="emptyBox" class="text-center py-5 d-none">
            <div style="font-size: 4rem; opacity: 0.4;">🖼️</div>
            <h4 class="text-secondary mt-3">还没有图片</h4>
            <p class="text-secondary">点击「上传图片」添加图片，或者确认仓库路径配置正确</p>
        </div>
    </div>

    <!-- 上传进度 -->
    <div id="uploadToast" class="position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
        <div id="uploadProgress" class="toast align-items-center text-bg-dark border-secondary d-none" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                    <div class="d-flex align-items-center gap-2">
                        <span class="spinner-border spinner-border-sm"></span>
                        <span id="uploadProgressText">正在上传...</span>
                    </div>
                    <div class="progress mt-1" style="height: 4px;">
                        <div id="uploadProgressBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="bootstra538dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
