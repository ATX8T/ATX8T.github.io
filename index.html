<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>ATX8T Lab · 开源工具集</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #fff;
            --text: #212529;
            --text-muted: #6c757d;
            --border: #dee2e6;
            --accent: #0d6efd;
            --accent2: #6610f2;
            --radius: 12px;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }

        /* === 导航 === */
        .navbar {
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 1px 3px rgba(0,0,0,.04);
        }
        .navbar-brand {
            font-weight: 800;
            font-size: 1.25rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* === Hero === */
        .hero {
            padding: 60px 0 40px;
            text-align: center;
        }
        .hero h1 {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 8px;
        }
        .hero h1 span {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero .lead {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 520px;
            margin: 0 auto;
        }

        /* === 项目卡片 === */
        .section-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            transition: transform .2s, box-shadow .2s;
            text-decoration: none;
            color: var(--text);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .project-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,.1);
            border-color: var(--accent);
            color: var(--text);
        }
        .project-card .icon {
            font-size: 2rem;
            line-height: 1;
        }
        .project-card .name {
            font-size: 1.1rem;
            font-weight: 700;
        }
        .project-card .desc {
            font-size: .85rem;
            color: var(--text-muted);
            line-height: 1.5;
            flex: 1;
        }
        .project-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .project-card .tag {
            font-size: .7rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: #e9ecef;
            color: #495057;
        }

        /* === Footer === */
        .footer {
            text-align: center;
            padding: 24px 0;
            color: var(--text-muted);
            font-size: .8rem;
            border-top: 1px solid var(--border);
            margin-top: 24px;
        }

        /* === 响应式 === */
        @media (max-width: 576px) {
            .hero h1 { font-size: 1.6rem; }
            .project-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="/">ATX8T Lab</a>
    </div>
</nav>

<div class="container">
    <!-- Hero -->
    <div class="hero">
        <h1>ATX8T <span>Lab</span></h1>
        <p class="lead" id="siteDesc">开源工具集 · GitHub 资源管理</p>
    </div>

    <!-- 项目列表 -->
    <div class="section-title">🛠️ 工具</div>
    <div class="project-grid" id="projectGrid">
        <!-- JS 动态生成 -->
    </div>

    <div id="loadingPlaceholder" class="project-grid">
        <div class="project-card" style="opacity:.5"><div class="icon">⋯</div><div class="name">加载中...</div></div>
    </div>

    <!-- Footer -->
    <div class="footer" id="footerText"></div>
</div>

<script>
/**
 * 首页 — 自动读取 projects.json 渲染项目卡片
 * 新增项目: 只需在 projects.json 的 projects 数组里加一条即可
 */
fetch('projects.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(data) {
        // 标题 & 描述
        if (data.site) {
            document.title = data.site.title + ' · 开源工具集';
            document.getElementById('siteDesc').textContent = data.site.desc;
            document.getElementById('footerText').textContent = data.site.footer || '';
        }

        // 渲染项目卡片
        var grid = document.getElementById('projectGrid');
        grid.innerHTML = '';
        (data.projects || []).forEach(function(p) {
            var card = document.createElement('a');
            card.className = 'project-card';
            card.href = p.path;

            var tagsHtml = (p.tags || []).map(function(t) {
                return '<span class="tag">' + t + '</span>';
            }).join('');

            card.innerHTML =
                '<div class="icon">' + (p.icon || '📦') + '</div>' +
                '<div class="name">' + p.name + '</div>' +
                '<div class="desc">' + p.desc + '</div>' +
                '<div class="tags">' + tagsHtml + '</div>';

            grid.appendChild(card);
        });

        // 移除 loading
        var lp = document.getElementById('loadingPlaceholder');
        if (lp) lp.remove();
    })
    .catch(function() {
        document.getElementById('projectGrid').innerHTML =
            '<div class="project-card"><div class="icon">⚠️</div><div class="name">加载失败</div><div class="desc">请检查 projects.json</div></div>';
        var lp = document.getElementById('loadingPlaceholder');
        if (lp) lp.remove();
    });
</script>

</body>
</html>
