<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>动态创建数据表</title>
    <link href="../../../bootstrap537/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card { border-radius: 1rem; }
        .card-header { border-radius: 1rem 1rem 0 0; }
        .form-label { font-weight: 500; }
        .btn-primary, .btn-success, .btn-info, .btn-secondary, .btn-warning {
            font-weight: 500; letter-spacing: 1px;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-9">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">动态创建/删除数据表</h4>
                </div>
                <div class="card-body">
                    <form id="tableForm">
                        <div class="mb-3">
                            <label class="form-label">数据表名</label>
                            <input type="text" class="form-control" name="tableName" id="tableName" value="webapisql2" required>
                        </div>
                        <div id="fieldsArea"></div>
                        <button type="button" class="btn btn-secondary mb-2" onclick="addField()">添加字段</button>
                        <button type="submit" class="btn btn-primary w-100">创建数据表</button>
                    </form>
                    <hr>
                    <h5>当前数据库中的数据表</h5>
                    <div id="tablesList"></div>
                    <div id="resultMsg" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../../../bootstrap537/js/bootstrap.bundle.min.js"></script>
<script>
const defaultFields = [
    {name:'id', type:'INT(11)', extra:'NOT NULL AUTO_INCREMENT PRIMARY KEY'},
    {name:'UserName', type:'VARCHAR(100)', extra:'NOT NULL'},
    {name:'Password', type:'VARCHAR(255)', extra:'NOT NULL'},
    {name:'Phone', type:'VARCHAR(30)', extra:'DEFAULT NULL'},
    {name:'age', type:'INT(3)', extra:'DEFAULT NULL'},
    {name:'email', type:'VARCHAR(100)', extra:'DEFAULT NULL'},
    {name:'DateTime', type:'DATETIME', extra:'DEFAULT CURRENT_TIMESTAMP'},
    {name:'Device', type:'VARCHAR(300)', extra:'DEFAULT NULL'},
    {name:'ip', type:'VARCHAR(100)', extra:'DEFAULT NULL'}
];

function addField(field = {name:'', type:'', extra:''}) {
    const area = document.getElementById('fieldsArea');
    const html = `
    <div class="row mb-2 field-row">
        <div class="col-md-3">
            <input type="text" class="form-control" placeholder="字段名" name="field_name" value="${field.name}" required>
        </div>
        <div class="col-md-4">
            <input type="text" class="form-control" placeholder="类型 如 VARCHAR(100)" name="field_type" value="${field.type}" required>
        </div>
        <div class="col-md-4">
            <input type="text" class="form-control" placeholder="额外属性 如 NOT NULL" name="field_extra" value="${field.extra}">
        </div>
        <div class="col-md-1">
            <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.field-row').remove()">删</button>
        </div>
    </div>`;
    area.insertAdjacentHTML('beforeend', html);
}

window.onload = function() {
    defaultFields.forEach(f => addField(f));
    loadTables();
};

document.getElementById('tableForm').onsubmit = function(e) {
    e.preventDefault();
    const tableName = document.getElementById('tableName').value.trim();
    const rows = document.querySelectorAll('.field-row');
    let fields = [];
    rows.forEach(row => {
        const inputs = row.querySelectorAll('input');
        fields.push({
            name: inputs[0].value.trim(),
            type: inputs[1].value.trim(),
            extra: inputs[2].value.trim()
        });
    });
    const formData = new FormData();
    formData.append('tableName', tableName);
    formData.append('fields', JSON.stringify(fields));
    fetch('../CreateDatabaseTable.php', {
        method: 'POST',
        body: formData
    })
    .then(resp => resp.text())
    .then(data => {
        document.getElementById('resultMsg').innerHTML = data;
        loadTables();
    })
    .catch(() => {
        document.getElementById('resultMsg').innerHTML = '<div class="alert alert-danger">请求失败</div>';
    });
};

// 加载数据库中的所有表
function loadTables() {
    fetch('../CreateDatabaseTable.php?listTables=1')
    .then(resp => resp.json())
    .then(data => {
        let html = '<table class="table table-bordered table-sm"><thead><tr><th>表名</th><th>操作</th></tr></thead><tbody>';
        data.forEach(table => {
            html += `<tr>
                <td>${table}</td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteTable('${table}')">删除</button>
                </td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('tablesList').innerHTML = html;
    })
    .catch(() => {
        document.getElementById('tablesList').innerHTML = '<div class="alert alert-danger">无法获取数据表列表</div>';
    });
}

// 删除数据表
function deleteTable(tableName) {
    if (!confirm('确定要删除数据表 "' + tableName + '" 吗？此操作不可恢复！')) return;
    const formData = new FormData();
    formData.append('deleteTable', tableName);
    fetch('../CreateDatabaseTable.php', {
        method: 'POST',
        body: formData
    })
    .then(resp => resp.text())
    .then(data => {
        document.getElementById('resultMsg').innerHTML = data;
        loadTables();
    })
    .catch(() => {
        document.getElementById('resultMsg').innerHTML = '<div class="alert alert-danger">请求失败</div>';
    });
}
</script>
</body>
</html>
