<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
    <link href="../../../bootstrap537/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            border-radius: 1rem;
        }
        .card-header {
            border-radius: 1rem 1rem 0 0;
        }
        .form-label {
            font-weight: 500;
        }
        .btn-primary, .btn-success, .btn-info, .btn-secondary, .btn-warning {
            font-weight: 500;
            letter-spacing: 1px;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">用户注册</h4>
                </div>
                <div class="card-body">
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="UserName" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="UserName" name="UserName" required>
                        </div>
                        <div class="mb-3">
                            <label for="Password" class="form-label">密码</label>
                            <input type="password" class="form-control" id="Password" name="Password" required>
                        </div>
                        <div class="mb-3">
                            <label for="Phone" class="form-label">手机号</label>
                            <input type="text" class="form-control" id="Phone" name="Phone">
                        </div>
                        <div class="mb-3">
                            <label for="age" class="form-label">年龄</label>
                            <input type="number" class="form-control" id="age" name="age">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="email" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="Device" class="form-label">设备信息</label>
                            <input type="text" class="form-control" id="Device" name="Device" value="" readonly>
                        </div>
                        <button type="button" class="btn btn-warning w-100 mb-2" onclick="randomFillFields()">随机生成字段</button>
                        <button type="submit" class="btn btn-primary w-100">注册</button>
                    </form>
                    <div id="resultMsg" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../../../bootstrap537/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('Device').value = navigator.userAgent;

function randomFillFields() {
    document.getElementById('UserName').value = 'user' + Math.floor(Math.random() * 100000);
    document.getElementById('Password').value = Math.random().toString(36).slice(-8);
    document.getElementById('Phone').value = '1' + Math.floor(3000000000 + Math.random() * 6999999999);
    document.getElementById('age').value = Math.floor(Math.random() * 60) + 18;
    document.getElementById('email').value = 'user' + Math.floor(Math.random() * 100000) + '@example.com';
}

document.getElementById('registerForm').onsubmit = function(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    fetch('../RegisterApi.php', {
        method: 'POST',
        body: formData
    })
    .then(resp => resp.json())
    .then(data => {
        let msgBox = document.getElementById('resultMsg');
        if (data.code === 200) {
            msgBox.innerHTML = '<div class="alert alert-success">' + data.msg + '</div>';
            form.reset();
            document.getElementById('Device').value = navigator.userAgent;
        } else {
            msgBox.innerHTML = '<div class="alert alert-danger">' + (data.msg || '注册失败') + '</div>';
        }
    })
    .catch(() => {
        document.getElementById('resultMsg').innerHTML = '<div class="alert alert-danger">请求失败</div>';
    });
};
</script>
</body>
</html>
