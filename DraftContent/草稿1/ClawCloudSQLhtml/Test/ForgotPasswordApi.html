<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>忘记密码</title>
    <link href="../../../bootstrap537/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card { border-radius: 1rem; }
        .card-header { border-radius: 1rem 1rem 0 0; }
        .form-label { font-weight: 500; }
        .btn-primary, .btn-success, .btn-info, .btn-secondary, .btn-warning {
            font-weight: 500; letter-spacing: 1px;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-info text-white text-center">
                    <h4 class="mb-0">忘记密码</h4>
                </div>
                <div class="card-body">
                    <form id="forgotForm">
                        <div class="mb-3">
                            <label for="UserName" class="form-label">用户名</label>
                            <input type="text" class="form-control" id="UserName" name="UserName" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">邮箱</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">新密码</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>
                        <button type="submit" class="btn btn-info w-100">重置密码</button>
                    </form>
                    <div id="resultMsg" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="../../../bootstrap537/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('forgotForm').onsubmit = function(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    fetch('../ForgotPasswordApi.php', {
        method: 'POST',
        body: formData
    })
    .then(resp => resp.json())
    .then(data => {
        let msgBox = document.getElementById('resultMsg');
        if (data.code === 200) {
            msgBox.innerHTML = '<div class="alert alert-success">' + data.msg + '</div>';
            form.reset();
        } else {
            msgBox.innerHTML = '<div class="alert alert-danger">' + (data.msg || '重置失败') + '</div>';
        }
    })
    .catch(() => {
        document.getElementById('resultMsg').innerHTML = '<div class="alert alert-danger">请求失败</div>';
    });
};
</script>
</body>
</html>
