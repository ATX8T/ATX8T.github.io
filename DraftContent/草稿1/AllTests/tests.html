<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>GitHub图片展示</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="../Bootstrap537Overall/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .img-container {
      max-width: 700px;
      margin: 60px auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px #e3e7ee40;
      padding: 2rem;
      text-align: center;
    }
    .img-container img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 2px 12px #e3e7ee60;
    }
  </style>
</head>
<body>
  <div class="img-container">
    <h2 class="mb-4">图片展示</h2>
    <img src="../Password/img/Background.png" alt="Background">
  </div>
  <script src="../Bootstrap537Overall/js/bootstrap.bundle.min.js"></script>
</body>
</html>
