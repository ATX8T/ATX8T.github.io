<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>图片画廊</title>
    <!-- Bootstrap 5.3.7 本地引用 -->
    <link href="../Bootstrap537Overall/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f8f8;
        }
        .gallery-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            background: #fff;
            cursor: pointer;
        }
        .gallery-img:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .gallery-row {
            max-width: 1200px;
            margin: 40px auto 0 auto;
        }
        h1 {
            text-align: center;
            margin-top: 32px;
            color: #333;
        }
        .modal-img {
            max-width: 80vw;
            max-height: 80vh;
            border-radius: 0.75rem;
            box-shadow: 0 4px 32px rgba(0,0,0,0.25);
            background: #fff;
            /* 动画相关 */
            opacity: 0;
            transform: scale(0.92);
            transition: opacity 0.35s cubic-bezier(.4,2,.6,1), transform 0.35s cubic-bezier(.4,2,.6,1);
        }
        .modal-img.show {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>
<body>
    <h1>图片画廊</h1>
    <div class="container gallery-row">
        <div class="row g-4" id="gallery-row">
            <!-- 动态图片将插入这里 -->
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="imgModal" tabindex="-1" aria-labelledby="imgModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" style="max-width:100vw;">
        <div class="modal-content bg-transparent border-0 shadow-none d-flex justify-content-center align-items-center" style="min-height:100vh;">
          <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="关闭"></button>
          <div class="d-flex flex-column justify-content-center align-items-center w-100" style="height:80vh;">
            <div id="modal-tip" class="text-white mb-2 small" style="text-shadow:0 1px 4px #000;user-select:none;">
              鼠标滚轮可切换上一张/下一张
            </div>
            <img src="" alt="放大图片" class="modal-img" style="display:block; margin:auto;">
          </div>
        </div>
      </div>
    </div>

    <script src="../Bootstrap537Overall/js/bootstrap.bundle.min.js"></script>
    <script>
        let galleryUrls = [];
        let currentIndex = 0;

        // 动态加载图片
        fetch('GalleryConnection.txt')
            .then(response => {
                if (!response.ok) throw new Error('网络错误: ' + response.status);
                return response.text();
            })
            .then(text => {
                galleryUrls = text.split('\n').map(line => line.trim()).filter(line => line && !line.startsWith('//'));
                const galleryRow = document.getElementById('gallery-row');
                galleryUrls.forEach((url, idx) => {
                    const col = document.createElement('div');
                    col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
                    const img = document.createElement('img');
                    img.className = 'gallery-img';
                    img.src = url;
                    img.alt = '图片' + (idx + 1);
                    img.setAttribute('data-bs-toggle', 'modal');
                    img.setAttribute('data-bs-target', '#imgModal');
                    img.setAttribute('data-index', idx);
                    col.appendChild(img);
                    galleryRow.appendChild(col);
                });

                document.querySelectorAll('.gallery-img').forEach(img => {
                    img.addEventListener('click', function() {
                        const modalImg = document.querySelector('#imgModal .modal-img');
                        currentIndex = parseInt(this.getAttribute('data-index'));
                        modalImg.src = galleryUrls[currentIndex];
                        modalImg.classList.remove('show');
                        setTimeout(() => modalImg.classList.add('show'), 10);
                    });
                });
            })
            .catch(err => {
                console.error('加载图片列表失败:', err);
            });

        // 关闭时清空src并移除动画
        document.getElementById('imgModal').addEventListener('hidden.bs.modal', function () {
            const modalImg = document.querySelector('#imgModal .modal-img');
            modalImg.src = '';
            modalImg.classList.remove('show');
        });

        // 鼠标滚轮切换上一张/下一张
        document.getElementById('imgModal').addEventListener('wheel', function (e) {
            if (!galleryUrls.length) return;
            e.preventDefault();
            if (e.deltaY < 0) {
                // 上一张
                currentIndex = (currentIndex - 1 + galleryUrls.length) % galleryUrls.length;
            } else if (e.deltaY > 0) {
                // 下一张
                currentIndex = (currentIndex + 1) % galleryUrls.length;
            }
            const modalImg = document.querySelector('#imgModal .modal-img');
            modalImg.classList.remove('show');
            setTimeout(() => {
                modalImg.src = galleryUrls[currentIndex];
                modalImg.classList.add('show');
            }, 10);
        }, { passive: false });

        // 支持移动端触摸滑动切换图片
        (function() {
            let startX = 0;
            let endX = 0;
            const modal = document.getElementById('imgModal');
            const modalImg = document.querySelector('#imgModal .modal-img');

            modalImg.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    startX = e.touches[0].clientX;
                }
            });

            modalImg.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1) {
                    endX = e.touches[0].clientX;
                }
            });

            modalImg.addEventListener('touchend', function(e) {
                if (startX && endX) {
                    const deltaX = endX - startX;
                    if (Math.abs(deltaX) > 50) { // 滑动阈值
                        if (deltaX > 0) {
                            // 向右滑，上一张
                            currentIndex = (currentIndex - 1 + galleryUrls.length) % galleryUrls.length;
                        } else {
                            // 向左滑，下一张
                            currentIndex = (currentIndex + 1) % galleryUrls.length;
                        }
                        modalImg.classList.remove('show');
                        setTimeout(() => {
                            modalImg.src = galleryUrls[currentIndex];
                            modalImg.classList.add('show');
                        }, 10);
                    }
                }
                startX = 0;
                endX = 0;
            });

            // 移动端点击图片以外区域关闭
            modal.addEventListener('touchstart', function(e) {
                if (!modalImg.contains(e.target)) {
                    const modalInstance = bootstrap.Modal.getOrCreateInstance(modal);
                    modalInstance.hide();
                }
            });
        })();

        // 点击图片区域以外关闭模态框
        document.getElementById('imgModal').addEventListener('mousedown', function(e) {
            const modalImg = document.querySelector('#imgModal .modal-img');
            if (!modalImg.contains(e.target)) {
                const modal = bootstrap.Modal.getOrCreateInstance(document.getElementById('imgModal'));
                modal.hide();
            }
        });
    </script>
</body>
</html>
